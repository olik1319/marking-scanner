<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Элементали: Слияние Стихий</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        header {
            text-align: center;
            padding: 15px 0;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ff9a00, #ff2e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            color: #a0a0c0;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .energy-container, .level-container, .score-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .energy-container {
            color: #ffcc00;
        }

        .level-container {
            color: #4cd964;
        }

        .score-container {
            color: #5ac8fa;
        }

        .value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .label {
            font-size: 0.8rem;
            margin-top: 3px;
        }

        .game-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            padding: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .rune {
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .rune:hover {
            transform: scale(1.05);
        }

        .rune.fire {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
        }

        .rune.water {
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            color: #fff;
        }

        .rune.earth {
            background: linear-gradient(135deg, #834d9b, #d04ed6);
            color: #fff;
        }

        .rune.air {
            background: linear-gradient(135deg, #56ccf2, #2f80ed);
            color: #fff;
        }

        .rune.light {
            background: linear-gradient(135deg, #f9d423, #ff4e50);
            color: #fff;
        }

        .rune.dark {
            background: linear-gradient(135deg, #434343, #000000);
            color: #fff;
        }

        .rune.lava {
            background: linear-gradient(135deg, #ff8c00, #ff2e00);
            color: #fff;
        }

        .rune.mist {
            background: linear-gradient(135deg, #8e9eab, #eef2f3);
            color: #333;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .btn-energy {
            background: linear-gradient(135deg, #ffcc00, #ff9500);
            color: #fff;
        }

        .btn-shop {
            background: linear-gradient(135deg, #5ac8fa, #007aff);
            color: #fff;
        }

        .btn-help {
            background: linear-gradient(135deg, #4cd964, #34c759);
            color: #fff;
        }

        .epic-items {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .epic-items h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-align: center;
            color: #ffcc00;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .item-icon {
            font-size: 1.8rem;
        }

        .item-name {
            font-size: 0.8rem;
            text-align: center;
        }

        .item-cost {
            font-size: 0.7rem;
            color: #ffcc00;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 700px;
            }
            
            .game-board {
                grid-template-columns: repeat(8, 1fr);
                grid-template-rows: repeat(8, 1fr);
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .items-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Элементали: Слияние Стихий</h1>
            <p class="subtitle">Собирай руны, создавай элементалей и побеждай!</p>
        </header>
        
        <div class="game-info">
            <div class="energy-container">
                <div class="value">150</div>
                <div class="label">ЭНЕРГИЯ</div>
            </div>
            <div class="level-container">
                <div class="value">5</div>
                <div class="label">УРОВЕНЬ</div>
            </div>
            <div class="score-container">
                <div class="value">2450</div>
                <div class="label">ОЧКИ</div>
            </div>
        </div>
        
        <div class="game-board">
            <!-- Руны будут генерироваться JavaScript -->
        </div>
        
        <div class="controls">
            <button class="btn-energy">ЭНЕРГИЯ</button>
            <button class="btn-shop">МАГАЗИН</button>
            <button class="btn-help">ПОМОЩЬ</button>
        </div>
        
        <div class="epic-items">
            <h2>ЭПИЧЕСКИЕ ПРЕДМЕТЫ</h2>
            <div class="items-grid">
                <div class="item">
                    <div class="item-icon">🔥</div>
                    <div class="item-name">Огненный шар</div>
                    <div class="item-cost">50 энергии</div>
                </div>
                <div class="item">
                    <div class="item-icon">💧</div>
                    <div class="item-name">Водный щит</div>
                    <div class="item-cost">75 энергии</div>
                </div>
                <div class="item">
                    <div class="item-icon">🌪️</div>
                    <div class="item-name">Вихрь</div>
                    <div class="item-cost">100 энергии</div>
                </div>
                <div class="item">
                    <div class="item-icon">⚡</div>
                    <div class="item-name">Молния</div>
                    <div class="item-cost">120 энергии</div>
                </div>
                <div class="item">
                    <div class="item-icon">💎</div>
                    <div class="item-name">Кристалл</div>
                    <div class="item-cost">150 энергии</div>
                </div>
                <div class="item">
                    <div class="item-icon">🌀</div>
                    <div class="item-name">Портал</div>
                    <div class="item-cost">200 энергии</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gameBoard = document.querySelector('.game-board');
            const runeTypes = ['fire', 'water', 'earth', 'air', 'light', 'dark', 'lava', 'mist'];
            const runeSymbols = {
                'fire': '🔥',
                'water': '💧',
                'earth': '🌍',
                'air': '💨',
                'light': '✨',
                'dark': '🌑',
                'lava': '🌋',
                'mist': '🌫️'
            };
            
            // Создаем игровое поле
            function createGameBoard() {
                gameBoard.innerHTML = '';
                const boardSize = window.innerWidth >= 768 ? 8 : 6;
                
                for (let i = 0; i < boardSize * boardSize; i++) {
                    const rune = document.createElement('div');
                    const randomType = runeTypes[Math.floor(Math.random() * 6)]; // Используем только базовые типы
                    
                    rune.className = `rune ${randomType}`;
                    rune.textContent = runeSymbols[randomType];
                    rune.dataset.type = randomType;
                    
                    rune.addEventListener('click', function() {
                        handleRuneClick(this);
                    });
                    
                    gameBoard.appendChild(rune);
                }
            }
            
            // Обработка клика по руне
            function handleRuneClick(runeElement) {
                // Добавляем анимацию выделения
                runeElement.style.transform = 'scale(1.1)';
                runeElement.style.boxShadow = '0 0 15px rgba(255, 255, 255, 0.7)';
                
                setTimeout(() => {
                    runeElement.style.transform = '';
                    runeElement.style.boxShadow = '';
                }, 300);
                
                // Здесь будет логика слияния рун
                console.log(`Выбрана руна: ${runeElement.dataset.type}`);
            }
            
            // Инициализация игры
            createGameBoard();
            
            // Обработчики кнопок
            document.querySelector('.btn-energy').addEventListener('click', function() {
                alert('Получить энергию можно за выполнение заданий или в магазине!');
            });
            
            document.querySelector('.btn-shop').addEventListener('click', function() {
                alert('Добро пожаловать в магазин эпических предметов!');
            });
            
            document.querySelector('.btn-help').addEventListener('click', function() {
                alert('Собирайте 3+ одинаковых руны в ряд для создания элементалей!');
            });
            
            // Обработчики предметов
            document.querySelectorAll('.item').forEach(item => {
                item.addEventListener('click', function() {
                    const itemName = this.querySelector('.item-name').textContent;
                    const itemCost = this.querySelector('.item-cost').textContent;
                    alert(`Вы хотите приобрести "${itemName}" за ${itemCost}?`);
                });
            });
        });
    </script>
</body>
</html>
