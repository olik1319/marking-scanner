<!DOCTYPE html>
<html>
<head>
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* CSS Variables for easy theme changes */
        :root {
            --primary-color: #007bff;
            --secondary-color: #28a745;
            --danger-color: #dc3545;
            --background-light: #f8f9fa;
            --background-dark: #e9ecef;
            --text-color: #343a40;
            --shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        /* Global Styles */
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
        }
        
        /* Main Container */
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 550px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--background-dark);
            padding-bottom: 10px;
        }
        
        /* Reader Area */
        #reader {
            width: 100%;
            min-height: 300px;
            border: 3px dashed var(--background-dark);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6c757d;
            font-size: 1.1rem;
        }

        /* Placeholder text before scanning starts */
        .placeholder {
            padding: 50px;
            text-align: center;
        }

        /* Results Display */
        #results {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 20px 0;
            padding: 15px;
            background: #e6f7ff;
            border-radius: 8px;
            border-left: 5px solid var(--primary-color);
            transition: all 0.3s ease;
        }
        
        /* Error/Info Message Display */
        #info-message {
            text-align: center;
            color: var(--danger-color);
            font-weight: bold;
            margin-top: -10px;
            margin-bottom: 10px;
            min-height: 20px;
        }

        /* Buttons Styling */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }
        
        /* Start Button Specific Styles */
        #scanButton.start {
            background: linear-gradient(45deg, var(--primary-color), #0056b3);
        }

        #scanButton.scanning {
            background: linear-gradient(45deg, #ffc107, #e0a800);
            cursor: default;
        }
        
        /* Export Button Specific Styles */
        #exportButton {
            background: linear-gradient(45deg, var(--secondary-color), #1e7e34);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Сканер кодов (DataMatrix GS1)</h1>
        
        <div id="reader">
            <div class="placeholder">Нажмите "Начать сканирование" для активации камеры.</div>
        </div>
        
        <div id="info-message"></div>
        <div id="results">Отсканировано: 0 кодов</div>

        <div class="button-group">
            <button id="scanButton" class="start" onclick="startScan()">▶️ Начать сканирование</button>
            <button id="exportButton" onclick="exportCSV()">💾 Экспорт в CSV</button>
        </div>
    </div>

    <script>
        let codes = [];
        let html5QrCode = null;
        let isScanning = false;
        const readerId = "reader";

        // Специальные символы для GS1 DataMatrix
        // FNC1 (ASCII 232) - обычно представляется как ^] или ]d2 в некоторых сканерах
        // GS (ASCII 29) - обычно представляется как ^G
        // В html5-qrcode эти символы могут быть представлены как:
        const FNC1 = String.fromCharCode(29); // FNC1 часто декодируется как GS (ASCII 29) в начале строки
        const GS = String.fromCharCode(29);   // GS (ASCII 29) - разделитель

        // Регулярное выражение для проверки структуры GS1 DataMatrix (Упрощенная проверка)
        // Проверяем, что код начинается с FNC1 (или его эквивалента) и содержит разделители GS
        // Так как html5-qrcode часто декодирует FNC1 в начале как GS (ASCII 29),
        // мы ищем начало с (01) или GS, а затем наличие GS в середине.
        const gs1Pattern = new RegExp(`^${GS}\\d{2}\\d{14}\\d{2}.*${GS}.*`);
        
        // Функция для отображения сообщений
        function displayMessage(text, isError = false) {
            const msgElement = document.getElementById('info-message');
            msgElement.textContent = text;
            msgElement.style.color = isError ? 'var(--danger-color)' : 'var(--primary-color)';
        }

        // --- Функция остановки сканирования после успешного считывания ---
        function stopScanAfterSuccess(success = true) {
            const button = document.getElementById('scanButton');
            const readerElement = document.getElementById(readerId);

            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    button.textContent = success ? '✅ Скан готов. Начать следующий?' : '❌ Повторить сканирование';
                    button.classList.remove('scanning');
                    button.classList.add('start');
                    button.disabled = false; 
                    
                    if (success) {
                        displayMessage("Код GS1 DataMatrix успешно считан.", false);
                        readerElement.innerHTML = '<div class="placeholder">Код успешно считан. Нажмите "Начать" для следующего.</div>';
                    } else {
                        readerElement.innerHTML = '<div class="placeholder">Неверный формат кода. Попробуйте снова.</div>';
                    }
                }).catch(err => {
                    console.error("Ошибка при остановке сканирования:", err);
                });
            }
        }

        function onScanSuccess(decodedText, result) {
            // 1. Проверяем, что это DataMatrix
            if (result.result.format.formatName !== 'DATA_MATRIX') {
                displayMessage(`Ошибка: Считан код формата ${result.result.format.formatName}. Требуется DataMatrix.`, true);
                stopScanAfterSuccess(false);
                return;
            }

            // 2. Проверяем, что это GS1 DataMatrix (проверка структуры)
            // Для корректной работы с DataMatrix, содержащим FNC1/GS, 
            // html5-qrcode должен быть настроен на вывод "сырых" данных.
            // Мы полагаемся на то, что DataMatrix маркировки начинается с GS (ASCII 29).
            
            // Проверка: код должен начинаться с символа-разделителя (ASCII 29)
            if (decodedText.startsWith(GS)) {
                
                // Код соответствует базовому требованию GS1 (начинается с GS)
                codes.push(decodedText);
                document.getElementById('results').innerHTML = 
                    'Отсканировано: ' + codes.length + ' кодов';
                
                // Успех
                stopScanAfterSuccess(true); 

            } else {
                displayMessage("Ошибка: Код DataMatrix не соответствует формату GS1 (нет символа FNC1/GS в начале).", true);
                stopScanAfterSuccess(false);
            }
        }

        function exportCSV() {
            if (codes.length === 0) {
                alert('Нет отсканированных кодов для экспорта.');
                return;
            }

            let csv = ''; 
            codes.forEach(codeString => {
                // Добавляем только код, заключенный в кавычки
                csv += `"${codeString}"\n`;
            });
            
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marking_codes.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function startScan() {
            const button = document.getElementById('scanButton');

            if (isScanning) {
                return;
            }
            
            displayMessage("Наведите камеру на код DataMatrix...", false);
            button.disabled = true;
            button.textContent = '... Сканирование активно ...';
            button.classList.remove('start');
            button.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode(readerId);
            }

            // Запрашиваем тыльную камеру
            const cameraConstraints = { 
                facingMode: "environment" 
            };

            // --- Ключевое изменение: Указываем DataMatrix как единственный поддерживаемый формат ---
            const config = { 
                fps: 10, 
                qrbox: 250,
                // Ограничиваем только DataMatrix
                supportedScanTypes: [
                    Html5QrcodeScanType.SCAN_TYPE_DATA_MATRIX
                ]
            };

            html5QrCode.start(
                cameraConstraints, 
                config, 
                onScanSuccess, 
                (errorMessage) => { 
                    // Игнорируем ошибки, пока камера ищет код
                }
            ).then(() => {
                isScanning = true;
                button.disabled = true; 
            }).catch(err => {
                alert("Ошибка запуска камеры. Проверьте, дали ли вы разрешение браузеру.");
                console.error("Camera start failed:", err);
                
                button.disabled = false;
                button.textContent = '▶️ Начать сканирование';
                button.classList.remove('scanning');
                button.classList.add('start');
                displayMessage("Не удалось запустить камеру.", true);
            });
        }
    </script>
</body>
</html>
