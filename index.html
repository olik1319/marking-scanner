<!DOCTYPE html>
<html>
<head>
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
    <div id="results" style="text-align: center; margin: 20px; font-size: 18px;"></div>
    <button onclick="exportCSV()" style="display: block; margin: 0 auto; padding: 10px 20px;">Экспорт в CSV</button>

    <script>
        let codes = [];
        
        function onScanSuccess(decodedText) {
            codes.push({
                code: decodedText,
                timestamp: new Date().toLocaleString()
            });
            document.getElementById('results').innerHTML = 
                'Отсканировано: ' + codes.length + ' кодов';
        }

        function exportCSV() {
            let csv = 'Код,Время сканирования\n';
            codes.forEach(row => {
                csv += `"${row.code}","${row.timestamp}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marking_codes.csv';
            a.click();
        }

        // Инициализация сканера
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
