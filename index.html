<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов</title>
    <!-- Основные библиотеки -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Библиотека для DataMatrix -->
    <script src="https://cdn.jsdelivr.net/npm/@paulmillr/dmarcode/dist/dmarcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            padding: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #333;
        }
        .settings {
            text-align: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        #reader {
            flex: 1;
            min-height: 35vh;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }
        #results {
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        #scanButton {
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        #scanButton.scanning {
            background: #ffc107;
            color: #000;
        }
        .secondary-btn {
            background: #6c757d;
            color: white;
        }
        .share-btn {
            background: #28a745;
            color: white;
        }
        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }
        .sound-toggle {
            text-align: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        .pdf-preview {
            max-width: 100%;
            max-height: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Сканер кодов (DataMatrix GS1)</h1>
        </div>
        
        <div class="settings">
            <label>
                <input type="checkbox" id="fullCodeMode" onchange="saveSettings()"> Полный код (все символы GS1)
            </label>
        </div>

        <div class="sound-toggle">
            <label>
                <input type="checkbox" id="soundEnabled" checked onchange="saveSettings()"> 🔊 Звук при сканировании
            </label>
        </div>
        
        <div id="reader">
            <div>Камера не активирована</div>
        </div>
        
        <!-- Preview для PDF -->
        <img id="pdfPreview" class="pdf-preview" alt="PDF Preview">
        
        <div id="results">Отсканировано: 0 кодов</div>
        
        <div class="buttons">
            <button id="scanButton" onclick="toggleScan()">▶️ НАЧАТЬ СКАНИРОВАНИЕ</button>
            
            <input type="file" id="fileInput" 
                   accept="image/*" 
                   style="display: none;" 
                   onchange="scanFromFile(event)">
            <button class="secondary-btn" onclick="document.getElementById('fileInput').click()">🖼️ Сканировать из изображения</button>

            <button class="share-btn" onclick="shareCodes()">📤 Поделиться</button>
            <button class="secondary-btn" onclick="exportCSV()">💾 Скачать CSV</button>
            <button class="secondary-btn" onclick="clearCodes()">🗑️ Очистить</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // Глобальные переменные
        window.codes = [];
        window.html5QrCode = null;
        window.isScanning = false;
        window.GS = String.fromCharCode(29);
        
        // --- Настройки и UI ---

        window.loadSettings = function() {
            const savedFullCode = localStorage.getItem('fullCodeMode');
            const fullCodeMode = savedFullCode === 'true';
            document.getElementById('fullCodeMode').checked = fullCodeMode;

            const savedSound = localStorage.getItem('soundEnabled');
            const soundEnabled = savedSound === null ? true : savedSound === 'true';
            document.getElementById('soundEnabled').checked = soundEnabled;
        }

        window.saveSettings = function() {
            const fullCodeMode = document.getElementById('fullCodeMode').checked;
            localStorage.setItem('fullCodeMode', fullCodeMode);

            const soundEnabled = document.getElementById('soundEnabled').checked;
            localStorage.setItem('soundEnabled', soundEnabled);
        }

        // Функция воспроизведения звука успешного сканирования
        window.playSuccessSound = function() {
            const soundEnabled = document.getElementById('soundEnabled').checked;
            if (!soundEnabled) return;

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.15);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
                
            } catch (error) {
                console.log('Ошибка воспроизведения звука успеха:', error);
            }
        }

        // Функция воспроизведения звука повторного сканирования (дубликат)
        window.playDuplicateSound = function() {
            const soundEnabled = document.getElementById('soundEnabled').checked;
            if (!soundEnabled) return;

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(300, audioContext.currentTime + 0.2);
                
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
                
            } catch (error) {
                console.log('Ошибка воспроизведения звука дубликата:', error);
            }
        }

        // Функция воспроизведения звука ошибки сканирования
        window.playErrorSound = function() {
            const soundEnabled = document.getElementById('soundEnabled').checked;
            if (!soundEnabled) return;

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime + 0.05);
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
                
            } catch (error) {
                console.log('Ошибка воспроизведения звука ошибки:', error);
            }
        }

        window.showToast = function(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#dc3545' : '#28a745';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2500);
        }

        window.updateResults = function() {
            document.getElementById('results').textContent = 'Отсканировано: ' + codes.length + ' кодов';
        }

        // --- Обработка сканированных кодов ---

        window.processScannedCode = function(decodedText) {
            const currentFullCodeMode = document.getElementById('fullCodeMode').checked; 

            // Логика извлечения кода
            let serializedCode;
            if (currentFullCodeMode) {
                serializedCode = decodedText;
            } else {
                const parts = decodedText.split(GS);
                serializedCode = parts.length > 1 ? parts[1] : decodedText;
            }
            
            if (!serializedCode) {
                showToast("Ошибка кода или неверный формат GS1", true);
                playErrorSound();
                return false;
            }
            
            if (codes.includes(serializedCode)) {
                showToast("Уже отсканирован", true);
                playDuplicateSound();
                return false;
            }
            
            playSuccessSound();
            codes.push(serializedCode);
            updateResults();
            showToast(`✅ +1 (всего: ${codes.length})`);
            return true;
        }

        // --- Логика сканирования с камеры ---

        window.onScanSuccess = function(decodedText, result) {
            // Проверка формата (только для сканирования с камеры)
            if (result && result.result.format.formatName !== 'DATA_MATRIX') {
                showToast('Требуется DataMatrix', true);
                playErrorSound();
                return;
            }

            processScannedCode(decodedText);
        }

        window.toggleScan = function() {
            if (isScanning) {
                stopScan();
            } else {
                startScan();
            }
        }

        window.startScan = function() {
            const button = document.getElementById('scanButton');
            
            saveSettings(); 

            button.textContent = '⏹️ ОСТАНОВИТЬ СКАНИРОВАНИЕ';
            button.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, 
                { 
                    fps: 10, 
                    qrbox: { width: 200, height: 200 },
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_DATA_MATRIX]
                }, 
                onScanSuccess, 
                () => {}
            ).then(() => {
                isScanning = true;
            }).catch(err => {
                showToast("Ошибка камеры: " + err, true);
                playErrorSound();
                stopScan();
            });
        }

        window.stopScan = function() {
            const button = document.getElementById('scanButton');
            
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                }).catch(() => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                });
            }
        }
        
        // --- Сканирование из файла ---

        window.scanFromFile = function(event) {
            if (isScanning) {
                showToast('Сначала остановите сканирование с камеры', true);
                event.target.value = null;
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            event.target.value = null; 

            if (file.type.startsWith('image/')) {
                scanImageFile(file);
            } else {
                showToast('Выберите изображение (PNG, JPG)', true);
                playErrorSound();
            }
        }

        // ОСНОВНАЯ ФУНКЦИЯ СКАНИРОВАНИЯ ИЗОБРАЖЕНИЙ
        function scanImageFile(file) {
            showToast(`Сканирование изображения...`);
            
            const img = new Image();
            const reader = new FileReader();
            
            reader.onload = function(e) {
                img.onload = function() {
                    // Показываем превью
                    const preview = document.getElementById('pdfPreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    
                    // Сканируем с помощью html5-qrcode
                    if (!html5QrCode) {
                        html5QrCode = new Html5Qrcode("reader");
                    }
                    
                    html5QrCode.scanFile(file, true)
                        .then(decodedText => {
                            processScannedCode(decodedText);
                        })
                        .catch(err => {
                            // Если html5-qrcode не сработал, пробуем dmarcode
                            scanWithDmarcode(img);
                        });
                };
                img.src = e.target.result;
            };
            
            reader.readAsDataURL(file);
        }

        // АЛЬТЕРНАТИВНОЕ СКАНИРОВАНИЕ С dmarcode
        async function scanWithDmarcode(img) {
            showToast('Пробуем альтернативное сканирование...');
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Устанавливаем размеры canvas
            canvas.width = img.width;
            canvas.height = img.height;
            
            // Рисуем изображение
            ctx.drawImage(img, 0, 0, img.width, img.height);
            
            try {
                // Получаем ImageData
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Пробуем найти DataMatrix с dmarcode
                const result = await dmarcode.decode(imageData);
                
                if (result && result.data) {
                    processScannedCode(result.data);
                } else {
                    showToast('DataMatrix не найден в изображении', true);
                    playErrorSound();
                }
            } catch (error) {
                showToast('Ошибка сканирования: ' + error.message, true);
                playErrorSound();
            }
        }

        // --- Утилиты ---

        window.shareCodes = function() {
            if (codes.length === 0) {
                showToast('Нет кодов для отправки', true);
                playErrorSound();
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const file = new File([blob], `codes_${codes.length}.csv`, { type: 'text/csv' });
            
            if (navigator.share) {
                navigator.share({
                    title: `Отсканированные коды (${codes.length})`,
                    files: [file]
                }).catch((error) => {
                    if (error.name !== 'AbortError') {
                        exportCSV();
                    }
                });
            } else {
                exportCSV();
            }
        }

        window.exportCSV = function() {
            if (codes.length === 0) {
                showToast('Нет кодов для скачивания', true);
                playErrorSound();
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codes_${codes.length}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Скачан CSV (${codes.length})`);
        }

        window.clearCodes = function() {
            if (codes.length === 0) {
                playErrorSound();
                return;
            }
            if (confirm(`Очистить ${codes.length} кодов?`)) {
                codes = [];
                updateResults();
                showToast('Очищено');
            }
        }

        // Загружаем настройки при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
        });
    </script>
</body>
</html>
