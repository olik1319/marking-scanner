<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web Audio Визуализатор (Three.js)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>3D Web Audio Визуализатор (Three.js)</h1>

    <input type="file" id="audioFile" accept="audio/*">
    
    <div id="audio-container"></div> 
    
    <div id="visualizer-container"></div> 
    
    <div id="controls">
        <button id="startRecording" disabled>Начать запись (только видео)</button>
        <button id="stopRecording" disabled>Остановить и скачать</button>
        <p class="warning">Примечание: Это скачает только видеофайл без звуковой дорожки. Для синхронизации используйте внешние программы.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="visualizer.js"></script>

</body>
</html>
