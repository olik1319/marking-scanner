<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов маркировки</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: white;
            padding: 0;
        }


        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }


        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #161b22;
            border-radius: 10px;
            border: 1px solid #30363d;
        }


        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
        }


        .scanner-section {
            background: #161b22;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }


        #video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }


        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }


        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid #58a6ff;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.7);
        }


        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #58a6ff;
            box-shadow: 0 0 10px #58a6ff;
            animation: scan 2s linear infinite;
        }


        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }


        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }


        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }


        .primary-btn {
            background: #238636;
            color: white;
        }


        .primary-btn:hover {
            background: #2ea043;
        }


        .secondary-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }


        .secondary-btn:hover {
            background: #30363d;
        }


        .danger-btn {
            background: #da3633;
            color: white;
        }


        .danger-btn:hover {
            background: #f85149;
        }


        .manual-input {
            background: #161b22;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }


        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
        }


        input:focus {
            outline: none;
            border-color: #58a6ff;
        }


        .codes-section {
            background: #161b22;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #30363d;
        }


        .counter {
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
            color: #58a6ff;
        }


        .codes-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }


        .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
        }


        .code-text {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
            flex: 1;
            color: #c9d1d9;
        }


        .delete-btn {
            background: #da3633;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }


        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            font-size: 14px;
        }


        .status.success {
            background: #13233a;
            color: #58a6ff;
            border: 1px solid #1f6feb;
        }


        .status.error {
            background: #2d1c1c;
            color: #f85149;
            border: 1px solid #da3633;
        }


        .status.warning {
            background: #2d211c;
            color: #e3b341;
            border: 1px solid #d29922;
        }


        .debug-info {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Сканер кодов маркировки</h1>
            <p>Настоящий сканер с доступом к камере</p>
        </header>


        <div class="scanner-section">
            <div id="video-container">
                <video id="video" muted playsinline></video>
                <canvas id="canvas" style="display: none;"></canvas>
                <div class="scan-overlay">
                    <div class="scan-frame">
                        <div class="scan-line"></div>
                    </div>
                </div>
            </div>


            <div class="controls">
                <button class="primary-btn" onclick="startScanner()" id="startBtn">🎥 Включить сканер</button>
                <button class="secondary-btn" onclick="stopScanner()" id="stopBtn" disabled>⏹️ Остановить</button>
            </div>


            <div id="scanner-status" class="status warning">
                Нажмите "Включить сканер" для доступа к камере
            </div>


            <div class="debug-info" id="debug-info">
                Статус: Ожидание запуска...
            </div>
        </div>


        <div class="manual-input">
            <h3>📝 Или введите код вручную:</h3>
            <input type="text" id="manual-input" placeholder="Введите код маркировки" autofocus>
            <button class="primary-btn" onclick="addManualCode()">➕ Добавить код</button>
        </div>


        <div class="codes-section">
            <div class="counter">
                🗃️ Собрано кодов: <span id="count">0</span>
            </div>


            <div class="codes-list" id="codes-list">
                <div class="status warning">Коды появятся здесь после сканирования</div>
            </div>


            <div class="controls">
                <button class="primary-btn" onclick="exportToCSV()">💾 Сохранить CSV</button>
                <button class="danger-btn" onclick="clearAll()">🗑️ Очистить все</button>
            </div>
        </div>
    </div>


    <script>
        let codes = JSON.parse(localStorage.getItem('markingCodes')) || [];
        let videoStream = null;
        let canvas = null;
        let canvasContext = null;
        let isScanning = false;
        let lastScannedCode = '';


        function updateDisplay() {
            document.getElementById('count').textContent = codes.length;
            const codesList = document.getElementById('codes-list');


            if (codes.length === 0) {
                codesList.innerHTML = '<div class="status warning">Коды появятся здесь после сканирования</div>';
                return;
            }


            codesList.innerHTML = '';
            codes.forEach((code, index) => {
                const codeItem = document.createElement('div');
                codeItem.className = 'code-item';
                codeItem.innerHTML = `
                    <span class="code-text">${code}</span>
                    <button class="delete-btn" onclick="deleteCode(${index})">✕</button>
                `;
                codesList.appendChild(codeItem);
            });


            localStorage.setItem('markingCodes', JSON.stringify(codes));
        }


        function showStatus(message, type = 'warning') {
            const status = document.getElementById('scanner-status');
            status.textContent = message;
            status.className = `status ${type}`;
        }


        function updateDebugInfo(message) {
            document.getElementById('debug-info').textContent = message;
        }


        async function startScanner() {
            try {
                showStatus('🔄 Запрашиваю доступ к камере...', 'warning');
                updateDebugInfo('Запрос разрешения на камеру...');


                const video = document.getElementById('video');


                // Останавливаем предыдущий поток если есть
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }


                // Пробуем разные конфигурации камеры
                const constraints = {
                    video: {
                        facingMode: 'environment', // Задняя камера
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };


                updateDebugInfo('Запрашиваю медиаустройства...');
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                updateDebugInfo('Доступ к камере получен!');


                video.srcObject = videoStream;


                // Ждем пока видео готово
                video.onloadedmetadata = function() {
                    updateDebugInfo('Видео загружено, запускаю сканирование...');


                    // Инициализируем canvas для анализа
                    canvas = document.getElementById('canvas');
                    canvasContext = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;


                    isScanning = true;
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = false;


                    showStatus('🔍 Сканирование... Наведите камеру на QR-код', 'success');
                    scanFrame();
                };


                video.play();


            } catch (error) {
                console.error('Camera error:', error);
                updateDebugInfo(`Ошибка: ${error.name} - ${error.message}`);


                let errorMessage = '❌ Ошибка доступа к камере: ';


                if (error.name === 'NotAllowedError') {
                    errorMessage += 'Разрешите доступ к камере в настройках браузера';
                } else if (error.name === 'NotFoundError') {
                    errorMessage += 'Камера не найдена';
                } else if (error.name === 'NotSupportedError') {
                    errorMessage += 'Браузер не поддерживает камеру';
                } else if (error.name === 'NotReadableError') {
                    errorMessage += 'Камера уже используется другим приложением';
                } else {
                    errorMessage += error.message;
                }


                showStatus(errorMessage, 'error');
                document.getElementById('startBtn').disabled = false;
            }
        }


        function scanFrame() {
            if (!isScanning) return;


            const video = document.getElementById('video');


            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                try {
                    canvasContext.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);


                    // Сканируем QR код
                    const code = jsQR(imageData.data, imageData.width, imageData.height);


                    if (code) {
                        const codeText = code.data.trim();
                        if (codeText !== lastScannedCode) {
                            lastScannedCode = codeText;
                            handleScannedCode(codeText);
                        }
                    }
                } catch (error) {
                    console.error('Scan error:', error);
                }
            }


            // Продолжаем сканирование
            if (isScanning) {
                requestAnimationFrame(scanFrame);
            }
        }


        function handleScannedCode(codeText) {
            if (!codes.includes(codeText)) {
                codes.push(codeText);
                updateDisplay();
                showStatus(`✅ Добавлен код: ${codeText.substring(0, 30)}...`, 'success');
                updateDebugInfo(`Найден код: ${codeText}`);


                // Вибрация (если поддерживается)
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }


                // Сбрасываем последний код через 3 секунды
                setTimeout(() => {
                    lastScannedCode = '';
                    showStatus('🔍 Сканирование... Наведите камеру на QR-код', 'success');
                }, 3000);


            } else {
                showStatus('⚠️ Этот код уже есть в списке', 'warning');
            }
        }


        function stopScanner() {
            isScanning = false;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            showStatus('⏹️ Сканер остановлен', 'warning');
            updateDebugInfo('Сканер остановлен');
        }


        function addManualCode() {
            const input = document.getElementById('manual-input');
            const code = input.value.trim();


            if (code) {
                if (!codes.includes(code)) {
                    codes.push(code);
                    input.value = '';
                    updateDisplay();
                    showStatus('✅ Код добавлен вручную', 'success');
                } else {
                    showStatus('⚠️ Этот код уже есть в списке', 'warning');
                input.focus();
                    input.select();
                return;
            }
            input.focus();
        }


        function deleteCode(index) {
            codes.splice(index, 1);
            updateDisplay();
            showStatus('🗑️ Код удален', 'warning');
        }


        function clearAll() {
            if (codes.length > 0 && confirm(`Удалить все ${codes.length} кодов?`)) {
                codes = [];
                updateDisplay();
                showStatus('Все коды удалены', 'warning');
            }
        }


        function exportToCSV() {
            if (codes.length === 0) {
                showStatus('❌ Нет кодов для сохранения', 'error');
                return;
            }


            const csvContent = "data:text/csv;charset=utf-8," + codes.join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `marking_codes_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);


            showStatus(`💾 Сохранено ${codes.length} кодов в CSV`, 'success');
        }


        // Обработка Enter в ручном вводе
        document.getElementById('manual-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addManualCode();
            }
        });


        // Автофокус на поле ввода
        document.getElementById('manual-input').focus();


        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            updateDisplay();
            updateDebugInfo('Готов к работе. Нажмите "Включить сканер"');
        });
    </script>
</body>
</html>
