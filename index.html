<!DOCTYPE html>
<html>
<head>
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* CSS Variables for easy theme changes */
        :root {
            --primary-color: #007bff;
            --secondary-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --background-light: #f8f9fa;
            --background-dark: #e9ecef;
            --text-color: #343a40;
            --shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        /* Global Styles */
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
        }
        
        /* Main Container */
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 550px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--background-dark);
            padding-bottom: 10px;
        }
        
        /* Reader Area */
        #reader {
            width: 100%;
            min-height: 300px;
            border: 3px dashed var(--background-dark);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6c757d;
            font-size: 1.1rem;
        }

        /* Placeholder text before scanning starts */
        .placeholder {
            padding: 50px;
            text-align: center;
        }

        /* Results Display */
        #results {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 20px 0;
            padding: 15px;
            background: #e6f7ff;
            border-radius: 8px;
            border-left: 5px solid var(--primary-color);
            transition: all 0.3s ease;
        }
        
        /* Status Message Display */
        #info-message {
            text-align: center;
            font-weight: bold;
            margin-top: -10px;
            margin-bottom: 10px;
            min-height: 20px;
            word-break: break-all;
        }
        
        /* Status Colors */
        .status-ok { color: var(--secondary-color); }
        .status-error { color: var(--danger-color); }
        .status-checking { color: var(--primary-color); }

        /* Buttons Styling */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }
        
        /* Start Button Specific Styles */
        #scanButton.start {
            background: linear-gradient(45deg, var(--primary-color), #0056b3);
        }

        #scanButton.scanning {
            background: linear-gradient(45deg, var(--warning-color), #e0a800);
            cursor: default;
        }
        
        /* Export Button Specific Styles */
        #exportButton {
            background: linear-gradient(45deg, var(--secondary-color), #1e7e34);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Сканер кодов (DataMatrix GS1)</h1>
        
        <div id="reader">
            <div class="placeholder">Нажмите "Начать сканирование" для активации камеры.</div>
        </div>
        
        <div id="info-message"></div>
        <div id="results">Отсканировано: 0 кодов</div>

        <div class="button-group">
            <button id="scanButton" class="start" onclick="startScan()">▶️ Начать сканирование</button>
            <button id="exportButton" onclick="exportCSV()">💾 Экспорт в CSV</button>
        </div>
    </div>

    <script>
        let codes = [];
        let html5QrCode = null;
        let isScanning = false;
        const readerId = "reader";
        
        // Символ GS (ASCII 29) - разделитель групп данных / FNC1
        const GS = String.fromCharCode(29); 

        // Функция для отображения сообщений
        function displayMessage(text, className = 'status-ok') {
            const msgElement = document.getElementById('info-message');
            msgElement.textContent = text;
            msgElement.className = className;
        }

        // --- Функция остановки сканирования ---
        function stopScanAfterSuccess(success = true, message = '') {
            const button = document.getElementById('scanButton');
            const readerElement = document.getElementById(readerId);

            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    button.disabled = false;
                    
                    if (success) {
                        button.textContent = '✅ Скан готов. Начать следующий?';
                        readerElement.innerHTML = '<div class="placeholder">Код успешно считан. Нажмите "Начать" для следующего.</div>';
                    } else {
                        button.textContent = '❌ Повторить сканирование';
                        readerElement.innerHTML = '<div class="placeholder">Неверный формат или ошибка. Попробуйте снова.</div>';
                    }
                    
                    button.classList.remove('scanning');
                    button.classList.add('start');
                    displayMessage(message, success ? 'status-ok' : 'status-error');

                }).catch(err => {
                    console.error("Ошибка при остановке сканирования:", err);
                });
            }
        }

        // --- ФУНКЦИЯ ФОРМАТИРОВАНИЯ: ОБРЕЗАНИЕ ПОСЛЕ ПЕРВОГО GS ---
        function formatGs1CodeForEdo(decodedText) {
            // 1. Находим позицию первого символа GS (ASCII 29)
            // ВАЖНО: Первый символ GS является FNC1 в начале строки. 
            // Нам нужно найти ВТОРОЙ символ GS, который стоит после серийного номера.
            
            const firstGSIndex = decodedText.indexOf(GS); // Это FNC1
            
            if (firstGSIndex === -1) {
                // Если GS вообще нет (не GS1 код), возвращаем null
                return null;
            }

            // Ищем второй символ GS, начиная с позиции после первого
            const secondGSIndex = decodedText.indexOf(GS, firstGSIndex + 1);

            let result = decodedText;

            if (secondGSIndex !== -1) {
                // Обрезаем строку, оставляя все до второго GS
                result = decodedText.substring(0, secondGSIndex);
            }
            
            // 2. Удаляем первый символ GS (FNC1)
            if (result.startsWith(GS)) {
                result = result.substring(1);
            }
            
            // Теперь результат должен быть: 01(GTIN)21(Серийный номер)
            return result;
        }


        function onScanSuccess(decodedText, result) {
            // 1. Проверяем формат DataMatrix
            if (result.result.format.formatName !== 'DATA_MATRIX') {
                stopScanAfterSuccess(false, `Ошибка: Считан код формата ${result.result.format.formatName}. Требуется DataMatrix.`);
                return;
            }

            // 2. Проверяем GS1 (начинается с GS)
            if (!decodedText.startsWith(GS)) {
                stopScanAfterSuccess(false, "Ошибка: Код DataMatrix не соответствует формату GS1 (нет символа GS в начале).");
                return;
            }

            // 3. ФОРМАТИРОВАНИЕ ДЛЯ ЭДО: Обрезаем после серийного номера
            const serializedCode = formatGs1CodeForEdo(decodedText);

            if (!serializedCode || serializedCode.length < 25) {
                stopScanAfterSuccess(false, "Ошибка форматирования: Не удалось извлечь КИЗ. Проверьте структуру кода.");
                return;
            }
            
            // 4. Сохраняем отформатированный код
            codes.push(serializedCode);
            document.getElementById('results').innerHTML = 
                'Отсканировано: ' + codes.length + ' кодов';
            
            // Успешно считан и отформатирован
            stopScanAfterSuccess(true, `Код отформатирован для ЭДО: ${serializedCode}`);
        }

        function exportCSV() {
            if (codes.length === 0) {
                alert('Нет отсканированных кодов для экспорта.');
                return;
            }

            let csv = ''; 
            codes.forEach(codeString => {
                csv += `${codeString}\n`; 
            });
            
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marking_codes.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function startScan() {
            const button = document.getElementById('scanButton');

            if (isScanning) {
                return;
            }
            
            displayMessage("Наведите камеру на код DataMatrix...", 'status-checking');
            button.disabled = true;
            button.textContent = '... Сканирование активно ...';
            button.classList.remove('start');
            button.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode(readerId);
            }

            const cameraConstraints = { 
                facingMode: "environment" 
            };

            const config = { 
                fps: 10, 
                qrbox: 250,
                supportedScanTypes: [
                    Html5QrcodeScanType.SCAN_TYPE_DATA_MATRIX
                ]
            };

            html5QrCode.start(
                cameraConstraints, 
                config, 
                onScanSuccess, 
                (errorMessage) => { 
                    // Игнорируем ошибки, пока камера ищет код
                }
            ).then(() => {
                isScanning = true;
                button.disabled = true; 
            }).catch(err => {
                alert("Ошибка запуска камеры. Проверьте, дали ли вы разрешение браузеру.");
                console.error("Camera start failed:", err);
                
                button.disabled = false;
                button.textContent = '▶️ Начать сканирование';
                button.classList.remove('scanning');
                button.classList.add('start');
                displayMessage("Не удалось запустить камеру.", 'status-error');
            });
        }
    </script>
</body>
</html>
