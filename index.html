<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .cloud-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .cloud-btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ... остальной интерфейс ... -->
        
        <button class="onec-btn" onclick="showCloudOptions()">☁️ Удаленная синхронизация</button>
        
        <div id="cloudOptions" style="display: none;">
            <div class="cloud-options">
                <button class="cloud-btn" style="background: #4285F4;" onclick="syncWithGoogleDrive()">📊 Google Drive</button>
                <button class="cloud-btn" style="background: #007ee5;" onclick="syncWithDropbox()">📁 Dropbox</button>
                <button class="cloud-btn" style="background: #25D366;" onclick="syncWithTelegram()">💬 Telegram</button>
                <button class="cloud-btn" style="background: #FF6600;" onclick="syncWithEmail()">📧 Email</button>
            </div>
            
            <!-- Ручная настройка облака -->
            <div style="margin-top: 15px;">
                <input type="text" id="cloudWebhook" placeholder="Webhook URL (опционально)" style="width: 100%; padding: 8px;">
                <button onclick="setupCloudWebhook()" style="width: 100%; margin-top: 5px; padding: 10px; background: #666; color: white;">💾 Сохранить webhook</button>
            </div>
        </div>
    </div>

    <script>
        let cloudWebhookUrl = localStorage.getItem('cloudWebhook') || '';

        function showCloudOptions() {
            const options = document.getElementById('cloudOptions');
            options.style.display = options.style.display === 'none' ? 'block' : 'none';
            document.getElementById('cloudWebhook').value = cloudWebhookUrl;
        }

        function setupCloudWebhook() {
            cloudWebhookUrl = document.getElementById('cloudWebhook').value.trim();
            localStorage.setItem('cloudWebhook', cloudWebhookUrl);
            showToast('Webhook сохранен');
        }

        // 1. Google Drive через API
        async function syncWithGoogleDrive() {
            if (codes.length === 0) {
                showToast('Нет данных для синхронизации', true);
                return;
            }

            const data = prepareSyncData();
            
            // Создаем файл и скачиваем
            const jsonData = JSON.stringify(data, null, 2);
            downloadFile(jsonData, `scanner_codes_${Date.now()}.json`, 'application/json');
            
            showToast('📁 Файл готов. Загрузите в Google Drive');
            
            // Если есть webhook - отправляем уведомление
            if (cloudWebhookUrl) {
                sendWebhookNotification('Google Drive');
            }
        }

        // 2. Dropbox
        async function syncWithDropbox() {
            if (codes.length === 0) {
                showToast('Нет данных для синхронизации', true);
                return;
            }

            const data = prepareSyncData();
            const csvData = convertToCSV(data.codes);
            
            // Скачиваем оба формата
            downloadFile(JSON.stringify(data, null, 2), `scanner_data_${Date.now()}.json`, 'application/json');
            downloadFile("\uFEFF" + csvData, `scanner_codes_${Date.now()}.csv`, 'text/csv');
            
            showToast('📁 Файлы готовы. Загрузите в Dropbox');
            
            if (cloudWebhookUrl) {
                sendWebhookNotification('Dropbox');
            }
        }

        // 3. Telegram Bot
        async function syncWithTelegram() {
            if (codes.length === 0) {
                showToast('Нет данных для отправки', true);
                return;
            }

            const data = prepareSyncData();
            const text = `📊 Новые отсканированные коды: ${data.count} шт.\nВремя: ${new Date(data.timestamp).toLocaleString()}`;
            
            // Создаем файл
            const file = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            
            if (navigator.share && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: `Коды (${data.count} шт)`,
                        text: text,
                        files: [file]
                    });
                    showToast('✅ Данные отправлены в Telegram');
                } catch (error) {
                    fallbackTelegram(data);
                }
            } else {
                fallbackTelegram(data);
            }
        }

        function fallbackTelegram(data) {
            const jsonData = JSON.stringify(data, null, 2);
            downloadFile(jsonData, `telegram_codes_${Date.now()}.json`, 'application/json');
            showToast('📁 Файл готов. Отправьте в Telegram');
        }

        // 4. Email
        async function syncWithEmail() {
            if (codes.length === 0) {
                showToast('Нет данных для отправки', true);
                return;
            }

            const data = prepareSyncData();
            const csvData = convertToCSV(data.codes);
            
            const subject = `Отсканированные коды (${data.count} шт)`;
            const body = `Во вложении данные сканирования:\n- Количество: ${data.count}\n- Время: ${new Date().toLocaleString()}\n\nФайлы:\n1. JSON - полные данные\n2. CSV - только коды`;
            
            // Создаем временные файлы
            const jsonFile = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const csvFile = new Blob(["\uFEFF" + csvData], { type: 'text/csv' });
            
            // Пытаемся отправить через почту
            const mailtoLink = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoLink;
            
            // Fallback - скачивание файлов
            setTimeout(() => {
                downloadFile(JSON.stringify(data, null, 2), `email_codes_${Date.now()}.json`, 'application/json');
                downloadFile("\uFEFF" + csvData, `email_codes_${Date.now()}.csv`, 'text/csv');
                showToast('📧 Файлы готовы. Прикрепите к письму');
            }, 1000);
        }

        // Webhook уведомление
        async function sendWebhookNotification(service) {
            if (!cloudWebhookUrl) return;
            
            try {
                await fetch(cloudWebhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        service: service,
                        action: 'new_data',
                        count: codes.length,
                        timestamp: new Date().toISOString(),
                        message: `Новые данные доступны в ${service}`
                    })
                });
            } catch (error) {
                console.log('Webhook error:', error);
            }
        }

        // Вспомогательные функции
        function prepareSyncData() {
            return {
                scanner_app: "DataMatrix Scanner",
                version: "1.0",
                timestamp: new Date().toISOString(),
                codes: codes,
                count: codes.length,
                format: "GS1 DataMatrix"
            };
        }

        function convertToCSV(codesArray) {
            return codesArray.join('\n');
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    </script>
</body>
</html>
