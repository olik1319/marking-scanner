<!DOCTYPE html>
<html>
<head>
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e8;
            color: #2e7d32;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Сканер кодов маркировки</h1>
    <div id="status"></div>
    <div id="reader"></div>
    <div id="results"></div>
    <button onclick="startScanner()">Запустить сканер</button>
    <button onclick="exportCSV()">Экспорт в CSV</button>

    <script>
        let codes = [];
        let scanner = null;

        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = type;
            setTimeout(() => {
                statusEl.textContent = '';
                statusEl.className = '';
            }, 5000);
        }

        async function startScanner() {
            try {
                // Останавливаем предыдущий сканер если есть
                if (scanner) {
                    await scanner.clear();
                }

                // Создаем новый сканер
                scanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 10, 
                        qrbox: { width: 250, height: 150 },
                        supportedScanTypes: [
                            Html5QrcodeScanType.SCAN_TYPE_QR_CODE,
                            Html5QrcodeScanType.SCAN_TYPE_CODE_128,
                            Html5QrcodeScanType.SCAN_TYPE_CODE_39
                        ]
                    },
                    false
                );

                scanner.render(onScanSuccess, onScanFailure);
                showStatus('Сканер запущен. Разрешите доступ к камере.');

            } catch (error) {
                console.error('Ошибка запуска сканера:', error);
                showStatus('Ошибка: ' + error.message, 'error');
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Проверяем на дубликаты
            if (!codes.some(item => item.code === decodedText)) {
                codes.push({
                    code: decodedText,
                    timestamp: new Date().toLocaleString('ru-RU')
                });
                
                document.getElementById('results').innerHTML = 
                    'Отсканировано: ' + codes.length + ' кодов<br>' +
                    'Последний: ' + decodedText;
                
                showStatus('Код отсканирован успешно!');
            } else {
                showStatus('Этот код уже был отсканирован', 'error');
            }
        }

        function onScanFailure(error) {
            // Игнорируем обычные ошибки сканирования
            // Они происходят постоянно когда камера ищет код
        }

        function exportCSV() {
            if (codes.length === 0) {
                showStatus('Нет данных для экспорта', 'error');
                return;
            }
            
            let csv = 'Код,Время сканирования\n';
            codes.forEach(row => {
                csv += `"${row.code}","${row.timestamp}"\n`;
            });
            
            // Добавляем BOM для правильного отображения кириллицы в Excel
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv; charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marking_codes.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            
            showStatus('Данные экспортированы в CSV');
        }

        // Автозапуск при загрузке
        window.addEventListener('load', function() {
            setTimeout(startScanner, 1000);
        });

        // Очистка при закрытии
        window.addEventListener('beforeunload', function() {
            if (scanner) {
                scanner.clear().catch(console.error);
            }
        });
    </script>
</body>
</html>
