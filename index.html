<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dynamsoft-javascript-barcode@9.6.30/dist/dbr.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            padding: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #333;
        }
        .settings {
            text-align: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        #reader {
            flex: 1;
            min-height: 35vh;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }
        #results {
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        #scanButton {
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        #scanButton.scanning {
            background: #ffc107;
            color: #000;
        }
        .secondary-btn {
            background: #6c757d;
            color: white;
        }
        .share-btn {
            background: #28a745;
            color: white;
        }
        .file-btn {
            background: #17a2b8;
            color: white;
        }
        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }
        .file-input-container {
            display: none;
            margin: 10px 0;
            text-align: center;
        }
        .file-input-label {
            display: inline-block;
            padding: 10px 15px;
            background: #17a2b8;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #fileInput {
            display: none;
        }
        .progress {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            margin: 5px 0;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background: #007bff;
            width: 0%;
            transition: width 0.3s;
        }
        .debug-info {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
            text-align: center;
        }
        .preview {
            max-width: 200px;
            max-height: 200px;
            margin: 10px auto;
            border: 1px solid #ccc;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Сканер кодов (DataMatrix GS1)</h1>
        </div>
        
        <div class="settings">
            <label>
                <input type="checkbox" id="fullCodeMode"> Полный код (все символы GS1)
            </label>
        </div>
        
        <div class="file-input-container" id="fileInputContainer">
            <label class="file-input-label">
                📁 Выбрать файлы (изображения/PDF)
                <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.bmp,.pdf,.webp" multiple>
            </label>
            <img id="imagePreview" class="preview" alt="Preview">
            <div class="progress" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="debugInfo" class="debug-info"></div>
        </div>
        
        <div id="reader">
            <div>Камера не активирована</div>
        </div>
        
        <div id="results">Отсканировано: 0 кодов</div>
        
        <div class="buttons">
            <button id="scanButton" onclick="toggleScan()">▶️ НАЧАТЬ СКАНИРОВАНИЕ</button>
            <button class="file-btn" onclick="toggleFileInput()">📁 Сканировать из файлов</button>
            <button class="share-btn" onclick="shareCodes()">📤 Поделиться</button>
            <button class="secondary-btn" onclick="exportCSV()">💾 Скачать CSV</button>
            <button class="secondary-btn" onclick="clearCodes()">🗑️ Очистить</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let codes = [];
        let html5QrCode = null;
        let isScanning = false;
        let fullCodeMode = false;
        let scanner = null;
        const GS = String.fromCharCode(29);
        
        // Инициализация PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // Инициализация Dynamsoft Barcode Scanner
        async function initBarcodeScanner() {
            try {
                await Dynamsoft.DBR.BarcodeScanner.license = "DLS2eyJvcmdhbml6YXRpb25JRCI6IjIwMDAwMSJ9";
                scanner = await Dynamsoft.DBR.BarcodeScanner.createInstance();
                console.log("Barcode scanner initialized");
            } catch (ex) {
                console.error("Failed to initialize barcode scanner:", ex);
            }
        }

        function loadSettings() {
            const saved = localStorage.getItem('fullCodeMode');
            if (saved !== null) {
                fullCodeMode = saved === 'true';
            } else {
                fullCodeMode = false;
            }
            document.getElementById('fullCodeMode').checked = fullCodeMode;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#dc3545' : '#28a745';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function updateDebugInfo(message) {
            document.getElementById('debugInfo').textContent = message;
        }

        function updateResults() {
            document.getElementById('results').textContent = 'Отсканировано: ' + codes.length + ' кодов';
        }

        function onScanSuccess(decodedText, result) {
            processScannedCode(decodedText, result);
        }

        function processScannedCode(decodedText, result = null) {
            let serializedCode;
            
            if (fullCodeMode) {
                serializedCode = decodedText;
            } else {
                // Для GS1 кодов ищем серийный номер после GS символа
                const parts = decodedText.split(GS);
                serializedCode = parts.length > 1 ? parts[1] : decodedText;
            }
            
            if (!serializedCode) {
                showToast("Ошибка кода", true);
                return false;
            }
            
            // Очищаем код от лишних символов
            serializedCode = serializedCode.replace(/[^\x20-\x7E]/g, '').trim();
            
            if (!serializedCode) {
                showToast("Пустой код после очистки", true);
                return false;
            }
            
            if (codes.includes(serializedCode)) {
                showToast("Уже отсканирован: " + serializedCode, true);
                return false;
            }
            
            codes.push(serializedCode);
            updateResults();
            showToast(`✅ Найден код: ${serializedCode}`);
            console.log('Найден код:', serializedCode);
            return true;
        }

        // Сканирование с помощью Dynamsoft (лучше для DataMatrix)
        async function scanWithDynamsoft(imageElement) {
            if (!scanner) {
                await initBarcodeScanner();
            }
            
            try {
                let results = await scanner.decode(imageElement);
                let foundCodes = 0;
                
                if (results && results.length > 0) {
                    for (let result of results) {
                        console.log("Found barcode:", result.barcodeText, "Format:", result.barcodeFormatString);
                        if (result.barcodeFormatString === "DataMatrix" || 
                            result.barcodeFormatString === "QR_CODE") {
                            if (processScannedCode(result.barcodeText)) {
                                foundCodes++;
                            }
                        }
                    }
                }
                return foundCodes;
            } catch (error) {
                console.log("Dynamsoft scan error:", error);
                return 0;
            }
        }

        // Сканирование с помощью html5-qrcode (запасной вариант)
        async function scanWithHtml5Qrcode(imageData) {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            try {
                const decodedText = await html5QrCode.scanFile(imageData, true);
                if (decodedText && processScannedCode(decodedText)) {
                    return 1;
                }
                return 0;
            } catch (error) {
                console.log("Html5Qrcode scan error:", error);
                return 0;
            }
        }

        function toggleScan() {
            if (isScanning) {
                stopScan();
            } else {
                startScan();
            }
        }

        function startScan() {
            const button = document.getElementById('scanButton');
            
            fullCodeMode = document.getElementById('fullCodeMode').checked;
            localStorage.setItem('fullCodeMode', fullCodeMode);

            button.textContent = '⏹️ ОСТАНОВИТЬ СКАНИРОВАНИЕ';
            button.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, 
                { 
                    fps: 10, 
                    qrbox: { width: 250, height: 250 },
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_DATA_MATRIX],
                    formatsToSupport: [Html5QrcodeSupportedFormats.DATA_MATRIX]
                }, 
                onScanSuccess, 
                () => {}
            ).then(() => {
                isScanning = true;
            }).catch(err => {
                showToast("Ошибка камеры", true);
                stopScan();
            });
        }

        function stopScan() {
            const button = document.getElementById('scanButton');
            
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                });
            }
        }

        function toggleFileInput() {
            const fileInputContainer = document.getElementById('fileInputContainer');
            if (fileInputContainer.style.display === 'block') {
                fileInputContainer.style.display = 'none';
            } else {
                fileInputContainer.style.display = 'block';
                updateDebugInfo('Выберите файлы для сканирования...');
            }
        }

        // Обработка выбора файлов
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            
            processFiles(files);
        });

        async function processFiles(files) {
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            let processedFiles = 0;
            let foundCodes = 0;

            progressContainer.style.display = 'block';
            updateDebugInfo(`Начата обработка ${files.length} файлов...`);
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                updateDebugInfo(`Обработка: ${file.name} (${i+1}/${files.length})`);
                
                try {
                    if (file.type === 'application/pdf') {
                        const codesFromPDF = await processPDF(file);
                        foundCodes += codesFromPDF;
                        updateDebugInfo(`PDF: ${file.name} - найдено ${codesFromPDF} кодов`);
                    } else {
                        const codesFromImage = await processImage(file);
                        foundCodes += codesFromImage;
                        updateDebugInfo(`Изображение: ${file.name} - найдено ${codesFromImage} кодов`);
                    }
                } catch (error) {
                    console.error('Ошибка обработки файла:', file.name, error);
                    updateDebugInfo(`Ошибка в файле: ${file.name}`);
                }
                
                processedFiles++;
                const progress = (processedFiles / files.length) * 100;
                progressBar.style.width = progress + '%';
            }
            
            setTimeout(() => {
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            }, 1000);
            
            updateResults();
            showToast(`Обработано: ${processedFiles} файлов, найдено: ${foundCodes} кодов`);
            document.getElementById('fileInput').value = '';
            updateDebugInfo(`Готово. Всего кодов: ${codes.length}`);
        }

        async function processPDF(file) {
            let foundInPDF = 0;
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                updateDebugInfo(`PDF страниц: ${pdf.numPages}`);
                
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 3.0 });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;
                    
                    // Пробуем оба метода сканирования
                    const imageData = canvas.toDataURL('image/jpeg', 0.9);
                    let codesFound = await scanWithDynamsoft(canvas);
                    
                    if (codesFound === 0) {
                        codesFound = await scanWithHtml5Qrcode(imageData);
                    }
                    
                    foundInPDF += codesFound;
                    updateDebugInfo(`Страница ${pageNum}: найдено ${codesFound} кодов`);
                }
            } catch (error) {
                console.error('PDF error:', error);
            }
            
            return foundInPDF;
        }

        async function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const img = new Image();
                        img.onload = async function() {
                            // Показываем превью
                            const preview = document.getElementById('imagePreview');
                            preview.src = e.target.result;
                            preview.style.display = 'block';
                            
                            // Пробуем Dynamsoft сначала
                            let codesFound = await scanWithDynamsoft(img);
                            
                            // Если не нашел, пробуем html5-qrcode
                            if (codesFound === 0) {
                                codesFound = await scanWithHtml5Qrcode(e.target.result);
                            }
                            
                            // Скрываем превью через 2 секунды
                            setTimeout(() => {
                                preview.style.display = 'none';
                            }, 2000);
                            
                            resolve(codesFound);
                        };
                        img.src = e.target.result;
                    } catch (error) {
                        console.error('Image processing error:', error);
                        resolve(0);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function shareCodes() {
            if (codes.length === 0) {
                showToast('Нет кодов для отправки', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const file = new File([blob], `codes_${codes.length}.csv`, { type: 'text/csv' });
            
            if (navigator.share) {
                navigator.share({
                    title: `Отсканированные коды (${codes.length})`,
                    files: [file]
                }).catch(() => {
                    exportCSV();
                });
            } else {
                exportCSV();
            }
        }

        function exportCSV() {
            if (codes.length === 0) {
                showToast('Нет кодов для скачивания', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codes_${codes.length}.csv`;
            a.click();
            showToast(`Скачан CSV (${codes.length} кодов)`);
        }

        function clearCodes() {
            if (codes.length === 0) return;
            if (confirm(`Очистить ${codes.length} кодов?`)) {
                codes = [];
                updateResults();
                showToast('Очищено');
                updateDebugInfo('Все коды очищены');
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            initBarcodeScanner();
            updateDebugInfo('Готов к работе. Выберите файлы или запустите камеру.');
        });
    </script>
</body>
</html>
