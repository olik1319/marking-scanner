<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            padding: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #333;
        }
        .settings {
            text-align: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        #reader {
            flex: 1;
            min-height: 35vh;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }
        #results {
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        #scanButton {
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        #scanButton.scanning {
            background: #ffc107;
            color: #000;
        }
        .secondary-btn {
            background: #6c757d;
            color: white;
        }
        .share-btn {
            background: #28a745;
            color: white;
        }
        .file-btn {
            background: #17a2b8;
            color: white;
        }
        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }
        .file-input-container {
            margin: 10px 0;
            text-align: center;
        }
        .file-input-label {
            display: inline-block;
            padding: 10px 15px;
            background: #17a2b8;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #fileInput {
            display: none;
        }
        .status {
            font-size: 0.8rem;
            color: #666;
            text-align: center;
            margin: 5px 0;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Сканер кодов (DataMatrix GS1)</h1>
        </div>
        
        <div class="settings">
            <label>
                <input type="checkbox" id="fullCodeMode"> Полный код (все символы GS1)
            </label>
        </div>
        
        <div class="file-input-container">
            <label class="file-input-label">
                📁 Выбрать изображения
                <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.bmp,.webp" multiple>
            </label>
            <div id="status" class="status">Выберите файлы для сканирования</div>
        </div>
        
        <div id="reader">
            <div>Камера не активирована</div>
        </div>
        
        <div id="results">Отсканировано: 0 кодов</div>
        
        <div class="buttons">
            <button id="scanButton" onclick="toggleScan()">▶️ НАЧАТЬ СКАНИРОВАНИЕ</button>
            <button class="share-btn" onclick="shareCodes()">📤 Поделиться</button>
            <button class="secondary-btn" onclick="exportCSV()">💾 Скачать CSV</button>
            <button class="secondary-btn" onclick="clearCodes()">🗑️ Очистить</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let codes = [];
        let html5QrCode = null;
        let isScanning = false;
        let fullCodeMode = false;
        const GS = String.fromCharCode(29);

        function loadSettings() {
            const saved = localStorage.getItem('fullCodeMode');
            if (saved !== null) {
                fullCodeMode = saved === 'true';
            } else {
                fullCodeMode = false;
            }
            document.getElementById('fullCodeMode').checked = fullCodeMode;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#dc3545' : '#28a745';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function updateResults() {
            document.getElementById('results').textContent = 'Отсканировано: ' + codes.length + ' кодов';
        }

        function onScanSuccess(decodedText, result) {
            if (result.result.format.formatName !== 'DATA_MATRIX') {
                showToast('Требуется DataMatrix', true);
                return;
            }

            let serializedCode = fullCodeMode ? decodedText : decodedText.split(GS)[1];
            
            if (!serializedCode) {
                showToast("Ошибка кода", true);
                return;
            }
            
            // Очищаем код
            serializedCode = serializedCode.replace(/[^\x20-\x7E]/g, '').trim();
            
            if (codes.includes(serializedCode)) {
                showToast("Уже отсканирован", true);
                return;
            }
            
            codes.push(serializedCode);
            updateResults();
            showToast(`✅ +1 (всего: ${codes.length})`);
        }

        function toggleScan() {
            if (isScanning) {
                stopScan();
            } else {
                startScan();
            }
        }

        function startScan() {
            const button = document.getElementById('scanButton');
            
            fullCodeMode = document.getElementById('fullCodeMode').checked;
            localStorage.setItem('fullCodeMode', fullCodeMode);

            button.textContent = '⏹️ ОСТАНОВИТЬ СКАНИРОВАНИЕ';
            button.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, 
                { 
                    fps: 10, 
                    qrbox: { width: 250, height: 250 },
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_DATA_MATRIX]
                }, 
                onScanSuccess, 
                () => {}
            ).then(() => {
                isScanning = true;
                updateStatus('Камера активна - сканируйте коды');
            }).catch(err => {
                showToast("Ошибка камеры: " + err.message, true);
                stopScan();
            });
        }

        function stopScan() {
            const button = document.getElementById('scanButton');
            
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                    updateStatus('Камера остановлена');
                }).catch(err => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                    updateStatus('Камера остановлена');
                });
            }
        }

        // Обработка выбора файлов
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            
            processFiles(files);
        });

        async function processFiles(files) {
            updateStatus(`Обработка ${files.length} файлов...`);
            let foundCodes = 0;
            let processedFiles = 0;

            for (let file of files) {
                try {
                    const codesFromFile = await processImageFile(file);
                    foundCodes += codesFromFile;
                    processedFiles++;
                    updateStatus(`Обработано ${processedFiles}/${files.length} файлов, найдено ${foundCodes} кодов`);
                } catch (error) {
                    console.error('Ошибка обработки файла:', file.name, error);
                    updateStatus(`Ошибка в файле: ${file.name}`);
                }
            }
            
            updateStatus(`Готово! Обработано ${processedFiles} файлов, найдено ${foundCodes} кодов`);
            showToast(`Найдено ${foundCodes} кодов из ${processedFiles} файлов`);
            updateResults();
        }

        async function processImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        if (!html5QrCode) {
                            html5QrCode = new Html5Qrcode("reader");
                        }
                        
                        // Пробуем сканировать файл
                        const decodedText = await html5QrCode.scanFile(e.target.result, true);
                        
                        if (decodedText) {
                            let serializedCode = fullCodeMode ? decodedText : decodedText.split(GS)[1];
                            
                            if (serializedCode) {
                                serializedCode = serializedCode.replace(/[^\x20-\x7E]/g, '').trim();
                                
                                if (serializedCode && !codes.includes(serializedCode)) {
                                    codes.push(serializedCode);
                                    showToast(`✅ Найден код в ${file.name}`);
                                    resolve(1);
                                    return;
                                }
                            }
                        }
                        resolve(0);
                    } catch (error) {
                        // Если не удалось распознать - это нормально
                        console.log(`Не удалось распознать код в ${file.name}:`, error.message);
                        resolve(0);
                    }
                };
                reader.onerror = () => resolve(0);
                reader.readAsDataURL(file);
            });
        }

        function shareCodes() {
            if (codes.length === 0) {
                showToast('Нет кодов для отправки', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const file = new File([blob], `codes_${codes.length}.csv`, { type: 'text/csv' });
            
            if (navigator.share) {
                navigator.share({
                    title: `Отсканированные коды (${codes.length})`,
                    files: [file]
                }).catch(() => {
                    exportCSV();
                });
            } else {
                exportCSV();
            }
        }

        function exportCSV() {
            if (codes.length === 0) {
                showToast('Нет кодов для скачивания', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codes_${codes.length}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Скачан CSV (${codes.length} кодов)`);
        }

        function clearCodes() {
            if (codes.length === 0) return;
            if (confirm(`Очистить ${codes.length} кодов?`)) {
                codes = [];
                updateResults();
                updateStatus('Все коды очищены');
                showToast('Очищено');
            }
        }

        // Загружаем настройки при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            updateStatus('Готов к работе');
        });
    </script>
</body>
</html>
