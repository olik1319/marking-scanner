<!DOCTYPE html>
<html>
<head>
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* CSS Variables for easy theme changes */
        :root {
            --primary-color: #007bff;
            --secondary-color: #28a745;
            --background-light: #f8f9fa;
            --background-dark: #e9ecef;
            --text-color: #343a40;
            --shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        /* Global Styles */
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
        }
        
        /* Main Container */
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 550px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--background-dark);
            padding-bottom: 10px;
        }
        
        /* Reader Area */
        #reader {
            width: 100%;
            min-height: 300px;
            border: 3px dashed var(--background-dark);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6c757d;
            font-size: 1.1rem;
        }

        /* Placeholder text before scanning starts */
        .placeholder {
            padding: 50px;
            text-align: center;
        }

        /* Results Display */
        #results {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 20px 0;
            padding: 15px;
            background: #e6f7ff; /* Light blue background */
            border-radius: 8px;
            border-left: 5px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        /* Buttons Styling */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }
        
        /* Start/Stop Button Specific Styles */
        #scanButton.start {
            background: linear-gradient(45deg, var(--primary-color), #0056b3);
        }

        #scanButton.stop {
            background: linear-gradient(45deg, #dc3545, #c82333); /* Red for stopping */
        }
        
        /* Export Button Specific Styles */
        #exportButton {
            background: linear-gradient(45deg, var(--secondary-color), #1e7e34);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Сканер кодов</h1>
        
        <div id="reader">
            <div class="placeholder">Нажмите "Начать сканирование" для активации камеры.</div>
        </div>
        
        <div id="results">Отсканировано: 0 кодов</div>

        <div class="button-group">
            <button id="scanButton" class="start" onclick="toggleScan()">▶️ Начать сканирование</button>
            <button id="exportButton" onclick="exportCSV()">💾 Экспорт в CSV</button>
        </div>
    </div>

    <script>
        let codes = [];
        let html5QrCode = null;
        let isScanning = false;
        const readerId = "reader";

        function onScanSuccess(decodedText) {
            // Добавляем код и время в массив
            codes.push({
                code: decodedText,
                timestamp: new Date().toLocaleString()
            });
            // Обновляем счетчик
            document.getElementById('results').innerHTML = 
                'Отсканировано: ' + codes.length + ' кодов';
        }

        function exportCSV() {
            if (codes.length === 0) {
                alert('Нет отсканированных кодов для экспорта.');
                return;
            }

            // Формируем CSV строку
            let csv = 'Код,Время сканирования\n';
            codes.forEach(row => {
                // Оборачиваем в кавычки для корректной обработки запятых
                csv += `"${row.code}","${row.timestamp}"\n`;
            });
            
            // Создаем Blob с BOM (\uFEFF) для корректного отображения кириллицы в Excel
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marking_codes.csv';
            
            // Имитируем клик для начала скачивания
            a.click();

            // Очистка
            window.URL.revokeObjectURL(url);
        }

        function toggleScan() {
            const button = document.getElementById('scanButton');

            if (isScanning) {
                // --- Логика ОСТАНОВКИ ---
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        isScanning = false;
                        button.textContent = '▶️ Начать сканирование';
                        button.classList.remove('stop');
                        button.classList.add('start');
                        // Возвращаем заглушку в область сканера
                        document.getElementById(readerId).innerHTML = '<div class="placeholder">Нажмите "Начать сканирование" для активации камеры.</div>';
                    }).catch(err => {
                        console.error("Ошибка при остановке сканирования:", err);
                        alert("Не удалось остановить сканирование.");
                    });
                }
            } else {
                // --- Логика ЗАПУСКА ---
                if (!html5QrCode) {
                    // Инициализируем сканер только при первом запуске
                    html5QrCode = new Html5Qrcode(readerId);
                }

                Html5Qrcode.getCameras().then(devices => {
                    if (devices && devices.length) {
                        // Используем первую доступную камеру
                        const cameraId = devices[0].id; 
                        
                        html5QrCode.start(
                            cameraId, 
                            { fps: 10, qrbox: 250 }, 
                            onScanSuccess, 
                            (errorMessage) => { 
                                // Можно игнорировать minor errors, чтобы не засорять консоль
                            }
                        ).then(() => {
                            isScanning = true;
                            button.textContent = '⏹️ Остановить сканирование';
                            button.classList.remove('start');
                            button.classList.add('stop');
                        }).catch(err => {
                            alert("Ошибка запуска камеры. Проверьте, дали ли вы разрешение браузеру.");
                            console.error("Camera start failed:", err);
                        });
                    } else {
                        alert("Камера не найдена на устройстве.");
                    }
                }).catch(err => {
                    console.error("Ошибка получения списка камер:", err);
                });
            }
        }
    </script>
</body>
</html>
