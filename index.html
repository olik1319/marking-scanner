<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов</title>
    <!-- Основные библиотеки -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- Добавлены библиотеки PDF.js для сканирования PDF-файлов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs" type="module"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            padding: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #333;
        }
        .settings {
            text-align: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        #reader {
            flex: 1;
            min-height: 35vh;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }
        #results {
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        #scanButton {
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        #scanButton.scanning {
            background: #ffc107;
            color: #000;
        }
        .secondary-btn {
            background: #6c757d;
            color: white;
        }
        .share-btn {
            background: #28a745;
            color: white;
        }
        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }
        .debug-info {
            font-size: 0.7rem;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Сканер кодов (DataMatrix GS1)</h1>
        </div>
        
        <div class="settings">
            <label>
                <input type="checkbox" id="fullCodeMode" onchange="saveSettings()"> Полный код (все символы GS1)
            </label>
        </div>
        
        <div id="reader">
            <div>Камера не активирована</div>
        </div>
        
        <div id="results">Отсканировано: 0 кодов</div>
        <div class="debug-info" id="debugInfo">Готов к работе</div>
        
        <div class="buttons">
            <button id="scanButton" onclick="toggleScan()">▶️ НАЧАТЬ СКАНИРОВАНИЕ</button>
            
            <!-- Скрытый элемент для выбора файла -->
            <input type="file" id="fileInput" 
                   accept="image/*, application/pdf" 
                   style="display: none;" 
                   onchange="scanFromFile(event)">
            <button class="secondary-btn" onclick="document.getElementById('fileInput').click()">🖼️ Сканировать из файла/PDF</button>

            <button class="share-btn" onclick="shareCodes()">📤 Поделиться</button>
            <button class="secondary-btn" onclick="exportCSV()">💾 Скачать CSV</button>
            <button class="secondary-btn" onclick="clearCodes()">🗑️ Очистить</button>
            <!-- Кнопка для отладки -->
            <button class="secondary-btn" onclick="testScanning()" style="font-size: 0.7rem;">🐛 Тест сканирования</button>
        </div>
    </div>

    <!-- Скрытый Canvas для рендеринга PDF-страниц -->
    <canvas id="pdfCanvas" style="display: none;"></canvas>
    <div id="toast" class="toast"></div>

    <script type="module">
        // Импорт PDF.js (требуется type="module")
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
        
        // Установка пути к worker.mjs
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

        // Глобальные переменные
        window.codes = [];
        window.html5QrCode = null;
        window.isScanning = false;
        window.GS = String.fromCharCode(29);
        
        // --- Настройки и UI ---

        window.loadSettings = function() {
            const saved = localStorage.getItem('fullCodeMode');
            const fullCodeMode = saved === 'true';
            document.getElementById('fullCodeMode').checked = fullCodeMode;
        }

        window.saveSettings = function() {
            const fullCodeMode = document.getElementById('fullCodeMode').checked;
            localStorage.setItem('fullCodeMode', fullCodeMode);
        }

        window.showToast = function(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#dc3545' : '#28a745';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        window.updateResults = function() {
            document.getElementById('results').textContent = 'Отсканировано: ' + codes.length + ' кодов';
        }

        window.updateDebugInfo = function(message) {
            document.getElementById('debugInfo').textContent = message;
        }

        // --- Логика сканирования ---

        window.onScanSuccess = function(decodedText, result) {
            // Читаем актуальное состояние чекбокса
            const currentFullCodeMode = document.getElementById('fullCodeMode').checked; 

            // Проверка формата (только для сканирования с камеры)
            if (result && result.result && result.result.format && result.result.format.formatName !== 'DATA_MATRIX') {
                showToast('Требуется DataMatrix', true);
                return;
            }

            // Логика извлечения кода
            let serializedCode;
            if (currentFullCodeMode) {
                serializedCode = decodedText;
            } else {
                // Более надежное извлечение GS1 кода
                const parts = decodedText.split(GS);
                serializedCode = parts.length > 1 ? parts[1] : decodedText;
            }
            
            if (!serializedCode || serializedCode.trim() === '') {
                showToast("Ошибка кода или неверный формат GS1", true);
                return;
            }
            
            if (codes.includes(serializedCode)) {
                showToast("Уже отсканирован", true);
                return;
            }
            
            codes.push(serializedCode);
            updateResults();
            showToast(`✅ +1 (всего: ${codes.length})`);
            updateDebugInfo(`Последний код: ${serializedCode.substring(0, 30)}...`);
        }

        // --- Управление камерой ---

        window.toggleScan = function() {
            if (isScanning) {
                stopScan();
            } else {
                startScan();
            }
        }

        window.startScan = function() {
            const button = document.getElementById('scanButton');
            
            // Сохраняем настройки при старте (на всякий случай)
            saveSettings(); 

            button.textContent = '⏹️ ОСТАНОВИТЬ СКАНИРОВАНИЕ';
            button.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, 
                { 
                    fps: 10, 
                    qrbox: { width: 200, height: 200 },
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_DATA_MATRIX]
                }, 
                onScanSuccess, 
                () => {}
            ).then(() => {
                isScanning = true;
                updateDebugInfo("Камера активна - сканируйте DataMatrix");
            }).catch(err => {
                showToast("Ошибка камеры: " + err, true);
                updateDebugInfo("Ошибка камеры: " + err);
                stopScan();
            });
        }

        window.stopScan = function() {
            const button = document.getElementById('scanButton');
            
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                    updateDebugInfo("Камера остановлена");
                }).catch(() => {
                    // Обработка случая, если камера уже была остановлена
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                    updateDebugInfo("Камера остановлена");
                });
            }
        }
        
        // --- Сканирование из файла (Изображение или PDF) ---

        window.scanFromFile = function(event) {
            if (isScanning) {
                showToast('Сначала остановите сканирование с камеры', true);
                event.target.value = null;
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            // Инициализируем объект, если он еще не создан
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            // Очищаем поле ввода
            event.target.value = null; 

            if (file.type === 'application/pdf') {
                scanPdfFile(file);
            } else if (file.type.startsWith('image/')) {
                scanImageFile(file);
            } else {
                showToast('Неподдерживаемый тип файла', true);
            }
        }

        function scanImageFile(file) {
            showToast(`Сканирование изображения: ${file.name}...`);
            updateDebugInfo(`Сканирование изображения: ${file.name}`);
            
            html5QrCode.scanFile(file, true)
                .then(decodedText => {
                    // СОЗДАЕМ ПРАВИЛЬНЫЙ МОК-ОБЪЕКТ ДЛЯ ФОРМАТА
                    const mockResult = { 
                        result: { 
                            format: { 
                                formatName: 'DATA_MATRIX',
                                format: 1
                            } 
                        } 
                    };
                    onScanSuccess(decodedText, mockResult);
                    updateDebugInfo(`Изображение отсканировано: ${decodedText.substring(0, 30)}...`);
                })
                .catch(err => {
                    if (err === "QR code parse error, error = No multi-formats found." || 
                        err.includes("No MultiFormat Readers were able to detect the code")) {
                        showToast('DataMatrix код не найден в изображении', true);
                        updateDebugInfo('DataMatrix не найден в изображении');
                    } else {
                        showToast(`Ошибка сканирования: ${err}`, true);
                        updateDebugInfo(`Ошибка: ${err}`);
                    }
                    console.error("File scan error:", err);
                });
        }

        async function scanPdfFile(file) {
            showToast(`Загрузка PDF (${file.name})...`, false);
            updateDebugInfo(`Загрузка PDF: ${file.name}`);
            
            const fileReader = new FileReader();
            fileReader.onload = async function() {
                try {
                    const pdfData = new Uint8Array(this.result);
                    const loadingTask = pdfjsLib.getDocument({ data: pdfData });
                    const pdf = await loadingTask.promise;
                    
                    const totalPages = pdf.numPages;
                    let codesFound = 0;
                    let duplicatesFound = 0;

                    showToast(`PDF загружен. Сканирование ${totalPages} страниц...`, false);
                    updateDebugInfo(`PDF: ${totalPages} страниц, сканирование...`);

                    for (let i = 1; i <= totalPages; i++) {
                        updateDebugInfo(`Сканирование страницы ${i} из ${totalPages}...`);
                        const page = await pdf.getPage(i);
                        
                        // УВЕЛИЧИВАЕМ КАЧЕСТВО РЕНДЕРИНГА
                        const viewport = page.getViewport({ scale: 3.0 });
                        const canvas = document.getElementById('pdfCanvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        canvas.style.width = viewport.width + 'px';
                        canvas.style.height = viewport.height + 'px';

                        // Рендерим с лучшим качеством
                        await page.render({
                            canvasContext: context,
                            viewport: viewport,
                            intent: 'display'
                        }).promise;

                        // Даем время на рендеринг
                        await new Promise(resolve => setTimeout(resolve, 100));

                        // Получаем изображение в высоком качестве
                        const dataUrl = canvas.toDataURL('image/png', 1.0);

                        // Сканируем изображение
                        try {
                            const decodedText = await html5QrCode.scanFile(dataUrl, true);
                            
                            // ОБРАБАТЫВАЕМ РЕЗУЛЬТАТ ПРАВИЛЬНО
                            if (decodedText) {
                                const currentFullCodeMode = document.getElementById('fullCodeMode').checked;
                                let serializedCode;
                                
                                if (currentFullCodeMode) {
                                    serializedCode = decodedText;
                                } else {
                                    // Более надежное извлечение GS1 кода
                                    const parts = decodedText.split(GS);
                                    serializedCode = parts.length > 1 ? parts[1] : decodedText;
                                }

                                if (serializedCode && serializedCode.trim() !== '') {
                                    if (!codes.includes(serializedCode)) {
                                        codes.push(serializedCode);
                                        updateResults();
                                        codesFound++;
                                        showToast(`✅ Найден код на стр. ${i}`);
                                        updateDebugInfo(`Стр. ${i}: найден код`);
                                    } else {
                                        duplicatesFound++;
                                    }
                                }
                            }
                            
                        } catch (scanError) {
                            // Код не найден на этой странице - это нормально
                            console.log(`На странице ${i} коды не найдены`);
                        }
                    }

                    const finalMessage = `✅ PDF сканирование завершено. Найдено: ${codesFound} новых, дубликатов: ${duplicatesFound}`;
                    showToast(finalMessage, false);
                    updateDebugInfo(finalMessage);

                } catch (error) {
                    const errorMessage = `Ошибка обработки PDF: ${error.message}`;
                    showToast(errorMessage, true);
                    updateDebugInfo(errorMessage);
                    console.error("PDF processing error:", error);
                }
            };
            fileReader.onerror = function() {
                showToast('Ошибка чтения PDF файла', true);
                updateDebugInfo('Ошибка чтения файла');
            };
            fileReader.readAsArrayBuffer(file);
        }

        // --- Утилиты ---

        window.shareCodes = function() {
            if (codes.length === 0) {
                showToast('Нет кодов для отправки', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const file = new File([blob], `codes_${codes.length}.csv`, { type: 'text/csv' });
            
            if (navigator.share) {
                navigator.share({
                    title: `Отсканированные коды (${codes.length})`,
                    files: [file]
                }).catch((error) => {
                    if (error.name !== 'AbortError') {
                        exportCSV();
                    }
                });
            } else {
                exportCSV();
            }
        }

        window.exportCSV = function() {
            if (codes.length === 0) {
                showToast('Нет кодов для скачивания', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codes_${codes.length}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Скачан CSV (${codes.length})`);
        }

        window.clearCodes = function() {
            if (codes.length === 0) return;
            if (confirm(`Очистить ${codes.length} кодов?`)) {
                codes = [];
                updateResults();
                updateDebugInfo('Все коды очищены');
                showToast('Очищено');
            }
        }

        // Функция для тестирования
        window.testScanning = function() {
            console.log('=== ТЕСТ СКАНИРОВАНИЯ ===');
            console.log('PDF.js version:', pdfjsLib.version);
            console.log('Current codes:', codes);
            console.log('HTML5 QR Code initialized:', !!html5QrCode);
            console.log('Is scanning:', isScanning);
            console.log('GS separator:', GS);
            console.log('Full code mode:', document.getElementById('fullCodeMode').checked);
            
            updateDebugInfo('Тест: ' + (html5QrCode ? 'Scanner OK' : 'Scanner NULL'));
            showToast('Тест завершен - проверьте консоль');
        }

        // Загружаем настройки при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            updateDebugInfo('Система готова к работе');
        });
    </script>
</body>
</html>
