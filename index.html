<!DOCTYPE html>
<html>
<head>
    <title>Сканер кодов маркировки</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        #reader {
            width: 100%;
            border: 3px dashed #667eea;
            border-radius: 10px;
            margin: 20px 0;
            background: #f8f9fa;
            min-height: 300px;
        }
        
        #results {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            padding: 15px;
            background: #e8f5e8;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        
        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .scan-info {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Сканер кодов маркировки</h1>
        
        <div id="reader"></div>
        
        <div class="scan-info">
            Наведите камеру на код для автоматического сканирования
        </div>
        
        <div id="results">Отсканировано: 0 кодов</div>
        
        <button onclick="exportCSV()">💾 Экспорт в CSV</button>
    </div>

    <script>
        let codes = [];
        
        function onScanSuccess(decodedText) {
            codes.push({
                code: decodedText,
                timestamp: new Date().toLocaleString()
            });
            document.getElementById('results').innerHTML = 
                'Отсканировано: ' + codes.length + ' кодов';
        }

        function exportCSV() {
            if (codes.length === 0) {
                alert('Нет отсканированных кодов для экспорта');
                return;
            }
            
            let csv = 'Код,Время сканирования\n';
            codes.forEach(row => {
                csv += `"${row.code}","${row.timestamp}"\n`;
            });
            
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv; charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marking_codes.csv';
            a.click();
        }

        // Инициализация сканера
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { 
                fps: 10, 
                qrbox: 250,
                supportedScanTypes: [
                    Html5QrcodeScanType.SCAN_TYPE_QR_CODE,
                    Html5QrcodeScanType.SCAN_TYPE_CODE_128,
                    Html5QrcodeScanType.SCAN_TYPE_CODE_39
                ]
            });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
