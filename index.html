<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            padding: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #333;
        }
        .settings {
            text-align: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        #reader {
            flex: 1;
            min-height: 35vh;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }
        #results {
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        #scanButton {
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        #scanButton.scanning {
            background: #ffc107;
            color: #000;
        }
        .secondary-btn {
            background: #6c757d;
            color: white;
        }
        .share-btn {
            background: #28a745;
            color: white;
        }
        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }
        .debug-info {
            font-size: 0.7rem;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }
        .progress {
            width: 100%;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 5px 0;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background: #007bff;
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Сканер кодов (DataMatrix GS1)</h1>
        </div>
        
        <div class="settings">
            <label>
                <input type="checkbox" id="fullCodeMode" onchange="saveSettings()"> Полный код (все символы GS1)
            </label>
        </div>
        
        <div id="reader">
            <div>Камера не активирована</div>
        </div>
        
        <div id="results">Отсканировано: 0 кодов</div>
        <div class="debug-info" id="debugInfo">Готов к работе</div>
        
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="buttons">
            <button id="scanButton" onclick="toggleScan()">▶️ НАЧАТЬ СКАНИРОВАНИЕ</button>
            
            <input type="file" id="fileInput" 
                   accept="image/*, application/pdf" 
                   style="display: none;" 
                   onchange="scanFromFile(event)">
            <button class="secondary-btn" onclick="document.getElementById('fileInput').click()">🖼️ Сканировать из файла/PDF</button>

            <button class="share-btn" onclick="shareCodes()">📤 Поделиться</button>
            <button class="secondary-btn" onclick="exportCSV()">💾 Скачать CSV</button>
            <button class="secondary-btn" onclick="clearCodes()">🗑️ Очистить</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // Глобальные переменные
        window.codes = [];
        window.html5QrCode = null;
        window.isScanning = false;
        window.GS = String.fromCharCode(29);
        
        // --- Настройки и UI ---

        window.loadSettings = function() {
            const saved = localStorage.getItem('fullCodeMode');
            const fullCodeMode = saved === 'true';
            document.getElementById('fullCodeMode').checked = fullCodeMode;
        }

        window.saveSettings = function() {
            const fullCodeMode = document.getElementById('fullCodeMode').checked;
            localStorage.setItem('fullCodeMode', fullCodeMode);
        }

        window.showToast = function(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#dc3545' : '#28a745';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        window.updateResults = function() {
            document.getElementById('results').textContent = 'Отсканировано: ' + codes.length + ' кодов';
        }

        window.updateDebugInfo = function(message) {
            document.getElementById('debugInfo').textContent = message;
        }

        window.updateProgress = function(percent, message = '') {
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            
            if (percent > 0) {
                progress.style.display = 'block';
                progressBar.style.width = percent + '%';
            } else {
                progress.style.display = 'none';
            }
            
            if (message) {
                updateDebugInfo(message);
            }
        }

        // --- Логика сканирования ---

        window.onScanSuccess = function(decodedText, result) {
            const currentFullCodeMode = document.getElementById('fullCodeMode').checked; 

            // Проверка формата (только для сканирования с камеры)
            if (result && result.result && result.result.format && result.result.format.formatName !== 'DATA_MATRIX') {
                showToast('Требуется DataMatrix', true);
                return;
            }

            // Логика извлечения кода
            let serializedCode;
            if (currentFullCodeMode) {
                serializedCode = decodedText;
            } else {
                const parts = decodedText.split(GS);
                serializedCode = parts.length > 1 ? parts[1] : decodedText;
            }
            
            if (!serializedCode || serializedCode.trim() === '') {
                showToast("Ошибка кода или неверный формат GS1", true);
                return;
            }
            
            if (codes.includes(serializedCode)) {
                showToast("Уже отсканирован", true);
                return;
            }
            
            codes.push(serializedCode);
            updateResults();
            showToast(`✅ +1 (всего: ${codes.length})`);
            updateDebugInfo(`Последний код: ${serializedCode.substring(0, 30)}...`);
        }

        // --- Управление камерой ---

        window.toggleScan = function() {
            if (isScanning) {
                stopScan();
            } else {
                startScan();
            }
        }

        window.startScan = function() {
            const button = document.getElementById('scanButton');
            
            saveSettings(); 

            button.textContent = '⏹️ ОСТАНОВИТЬ СКАНИРОВАНИЕ';
            button.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, 
                { 
                    fps: 10, 
                    qrbox: { width: 200, height: 200 },
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_DATA_MATRIX]
                }, 
                onScanSuccess, 
                () => {}
            ).then(() => {
                isScanning = true;
                updateDebugInfo("Камера активна - сканируйте DataMatrix");
            }).catch(err => {
                showToast("Ошибка камеры: " + err, true);
                updateDebugInfo("Ошибка камеры: " + err);
                stopScan();
            });
        }

        window.stopScan = function() {
            const button = document.getElementById('scanButton');
            
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                    updateDebugInfo("Камера остановлена");
                }).catch(() => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                    updateDebugInfo("Камера остановлена");
                });
            }
        }
        
        // --- Сканирование из файла (Изображение или PDF) ---

        window.scanFromFile = function(event) {
            if (isScanning) {
                showToast('Сначала остановите сканирование с камеры', true);
                event.target.value = null;
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            event.target.value = null; 

            if (file.type === 'application/pdf') {
                scanPdfFile(file);
            } else if (file.type.startsWith('image/')) {
                scanImageFile(file);
            } else {
                showToast('Неподдерживаемый тип файла', true);
            }
        }

        function scanImageFile(file) {
            showToast(`Сканирование изображения: ${file.name}...`);
            updateDebugInfo(`Сканирование изображения: ${file.name}`);
            
            html5QrCode.scanFile(file, true)
                .then(decodedText => {
                    const mockResult = { 
                        result: { 
                            format: { 
                                formatName: 'DATA_MATRIX',
                                format: 1
                            } 
                        } 
                    };
                    onScanSuccess(decodedText, mockResult);
                    updateDebugInfo(`Изображение отсканировано: ${decodedText.substring(0, 30)}...`);
                })
                .catch(err => {
                    if (err === "QR code parse error, error = No multi-formats found." || 
                        err.includes("No MultiFormat Readers were able to detect the code")) {
                        showToast('DataMatrix код не найден в изображении', true);
                        updateDebugInfo('DataMatrix не найден в изображении');
                    } else {
                        showToast(`Ошибка сканирования: ${err}`, true);
                        updateDebugInfo(`Ошибка: ${err}`);
                    }
                });
        }

        // НОВАЯ УЛУЧШЕННАЯ ФУНКЦИЯ СКАНИРОВАНИЯ PDF
        async function scanPdfFile(file) {
            showToast(`Загрузка PDF...`, false);
            updateProgress(10, 'Загрузка PDF...');

            try {
                // Используем внешний сервис для конвертации PDF в изображения
                const formData = new FormData();
                formData.append('file', file);

                updateProgress(30, 'Конвертация PDF в изображения...');
                
                // Конвертируем PDF в изображения с помощью бесплатного API
                const response = await fetch('https://api.pdf2image.xyz/convert', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Ошибка конвертации PDF');
                }

                const result = await response.json();
                
                if (!result.images || result.images.length === 0) {
                    throw new Error('Не удалось получить изображения из PDF');
                }

                updateProgress(50, `Обработка ${result.images.length} страниц...`);
                
                let codesFound = 0;
                let totalPages = result.images.length;

                // Сканируем каждое изображение
                for (let i = 0; i < totalPages; i++) {
                    const imageUrl = result.images[i];
                    updateProgress(50 + (i / totalPages) * 40, `Сканирование страницы ${i + 1} из ${totalPages}...`);

                    try {
                        // Загружаем изображение
                        const imgResponse = await fetch(imageUrl);
                        const blob = await imgResponse.blob();
                        
                        // Сканируем изображение
                        const decodedText = await html5QrCode.scanFile(blob, true);
                        
                        if (decodedText) {
                            const currentFullCodeMode = document.getElementById('fullCodeMode').checked;
                            let serializedCode;
                            
                            if (currentFullCodeMode) {
                                serializedCode = decodedText;
                            } else {
                                const parts = decodedText.split(GS);
                                serializedCode = parts.length > 1 ? parts[1] : decodedText;
                            }

                            if (serializedCode && serializedCode.trim() !== '') {
                                if (!codes.includes(serializedCode)) {
                                    codes.push(serializedCode);
                                    updateResults();
                                    codesFound++;
                                    showToast(`✅ Найден код на стр. ${i + 1}`);
                                }
                            }
                        }
                    } catch (scanError) {
                        // Пропускаем страницы без кодов
                        console.log(`Страница ${i + 1}: коды не найдены`);
                    }
                }

                updateProgress(100, `PDF сканирование завершено`);
                setTimeout(() => updateProgress(0), 2000);
                
                showToast(`✅ Найдено ${codesFound} кодов в PDF`, false);
                updateDebugInfo(`PDF: ${codesFound} кодов найдено`);

            } catch (error) {
                updateProgress(0);
                showToast(`Ошибка: ${error.message}`, true);
                updateDebugInfo(`Ошибка PDF: ${error.message}`);
                
                // Альтернативный метод - используем локальную конвертацию
                console.log('Пробуем альтернативный метод...');
                fallbackPdfScan(file);
            }
        }

        // АЛЬТЕРНАТИВНЫЙ МЕТОД ДЛЯ PDF
        async function fallbackPdfScan(file) {
            showToast('Используем альтернативный метод...', false);
            updateDebugInfo('Альтернативный метод PDF...');

            // Создаем iframe для отображения PDF
            const pdfUrl = URL.createObjectURL(file);
            const iframe = document.createElement('iframe');
            iframe.src = pdfUrl;
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            // Ждем загрузки PDF
            await new Promise(resolve => {
                iframe.onload = resolve;
            });

            let codesFound = 0;

            try {
                // Получаем количество страниц
                const pdfDoc = iframe.contentWindow?.document;
                if (!pdfDoc) throw new Error('Не удалось загрузить PDF');

                // Для простых PDF пытаемся найти изображения
                const images = pdfDoc.querySelectorAll('img');
                updateDebugInfo(`Найдено ${images.length} изображений в PDF`);

                for (let i = 0; i < images.length; i++) {
                    try {
                        const img = images[i];
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        canvas.width = img.naturalWidth || img.width;
                        canvas.height = img.naturalHeight || img.height;
                        
                        ctx.drawImage(img, 0, 0);
                        
                        const dataUrl = canvas.toDataURL('image/png');
                        
                        const decodedText = await html5QrCode.scanFile(dataUrl, true);
                        
                        if (decodedText) {
                            const currentFullCodeMode = document.getElementById('fullCodeMode').checked;
                            let serializedCode = currentFullCodeMode ? decodedText : decodedText.split(GS)[1];
                            
                            if (serializedCode && !codes.includes(serializedCode)) {
                                codes.push(serializedCode);
                                codesFound++;
                            }
                        }
                    } catch (e) {
                        // Пропускаем ошибки
                    }
                }

                if (codesFound > 0) {
                    updateResults();
                    showToast(`✅ Найдено ${codesFound} кодов`, false);
                } else {
                    showToast('Коды не найдены в PDF', true);
                }

            } catch (error) {
                showToast('Не удалось просканировать PDF', true);
            } finally {
                // Очистка
                document.body.removeChild(iframe);
                URL.revokeObjectURL(pdfUrl);
                updateProgress(0);
            }
        }

        // --- Утилиты ---

        window.shareCodes = function() {
            if (codes.length === 0) {
                showToast('Нет кодов для отправки', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const file = new File([blob], `codes_${codes.length}.csv`, { type: 'text/csv' });
            
            if (navigator.share) {
                navigator.share({
                    title: `Отсканированные коды (${codes.length})`,
                    files: [file]
                }).catch((error) => {
                    if (error.name !== 'AbortError') {
                        exportCSV();
                    }
                });
            } else {
                exportCSV();
            }
        }

        window.exportCSV = function() {
            if (codes.length === 0) {
                showToast('Нет кодов для скачивания', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codes_${codes.length}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Скачан CSV (${codes.length})`);
        }

        window.clearCodes = function() {
            if (codes.length === 0) return;
            if (confirm(`Очистить ${codes.length} кодов?`)) {
                codes = [];
                updateResults();
                updateDebugInfo('Все коды очищены');
                showToast('Очищено');
            }
        }

        // Загружаем настройки при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            updateDebugInfo('Система готова к работе');
        });
    </script>
</body>
</html>
