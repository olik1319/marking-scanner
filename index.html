<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик Очков "Мальчики vs Девочки"</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Битва Команд: Мальчики vs Девочки</h1>

        <div class="scoreboard">
            
            <div class="team" id="boys-team">
                <h2>Мальчики 👦</h2>
                <div class="score" id="boys-score">0</div>
                <button onclick="addPoint('boys')">+1 Очко</button>
            </div>

            <div class="team" id="girls-team">
                <h2>Девочки 👧</h2>
                <div class="score" id="girls-score">0</div>
                <button onclick="addPoint('girls')">+1 Очко</button>
            </div>

        </div>

        <button class="reset-button" onclick="resetGame()">Начать игру заново</button>

        <div class="winner-display" id="winner-display">
            Кто наберёт 10 очков первым?
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
