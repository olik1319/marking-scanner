<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов DataMatrix</title>
    
    <!-- Библиотеки для сканирования -->
    <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            padding: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #333;
        }
        .settings {
            text-align: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        #interactive {
            flex: 1;
            min-height: 35vh;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            position: relative;
            overflow: hidden;
        }
        #interactive.viewport {
            position: relative;
        }
        #interactive canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #results {
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        #scanButton {
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        #scanButton.scanning {
            background: #ffc107;
            color: #000;
        }
        .secondary-btn {
            background: #6c757d;
            color: white;
        }
        .share-btn {
            background: #28a745;
            color: white;
        }
        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }
        .debug-info {
            font-size: 0.7rem;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }
        .camera-select {
            text-align: center;
            margin: 5px 0;
        }
        #cameraSelection {
            width: 100%;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Сканер DataMatrix GS1</h1>
        </div>
        
        <div class="settings">
            <label>
                <input type="checkbox" id="fullCodeMode" onchange="saveSettings()"> Полный код (все символы GS1)
            </label>
        </div>

        <div class="camera-select">
            <select id="cameraSelection">
                <option value="">Выберите камеру...</option>
            </select>
        </div>
        
        <div id="interactive">
            <div>Камера не активирована</div>
        </div>
        
        <div id="results">Отсканировано: 0 кодов</div>
        <div class="debug-info" id="debugInfo">Готов к работе</div>
        
        <div class="buttons">
            <button id="scanButton" onclick="toggleScan()">▶️ НАЧАТЬ СКАНИРОВАНИЕ</button>
            
            <input type="file" id="fileInput" 
                   accept="image/*, application/pdf" 
                   style="display: none;" 
                   onchange="scanFromFile(event)">
            <button class="secondary-btn" onclick="document.getElementById('fileInput').click()">🖼️ Сканировать из файла/PDF</button>

            <button class="share-btn" onclick="shareCodes()">📤 Поделиться</button>
            <button class="secondary-btn" onclick="exportCSV()">💾 Скачать CSV</button>
            <button class="secondary-btn" onclick="clearCodes()">🗑️ Очистить</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Скрытые элементы -->
    <canvas id="tempCanvas" style="display: none;"></canvas>
    <img id="tempImage" style="display: none;">

    <script>
        // Глобальные переменные
        window.codes = [];
        window.isScanning = false;
        window.currentStream = null;
        window.GS = String.fromCharCode(29);
        
        // --- Настройки и UI ---

        window.loadSettings = function() {
            const saved = localStorage.getItem('fullCodeMode');
            const fullCodeMode = saved === 'true';
            document.getElementById('fullCodeMode').checked = fullCodeMode;
        }

        window.saveSettings = function() {
            const fullCodeMode = document.getElementById('fullCodeMode').checked;
            localStorage.setItem('fullCodeMode', fullCodeMode);
        }

        window.showToast = function(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#dc3545' : '#28a745';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        window.updateResults = function() {
            document.getElementById('results').textContent = 'Отсканировано: ' + codes.length + ' кодов';
        }

        window.updateDebugInfo = function(message) {
            document.getElementById('debugInfo').textContent = message;
        }

        // --- Логика сканирования ---

        window.processScannedCode = function(decodedText) {
            const currentFullCodeMode = document.getElementById('fullCodeMode').checked;

            // Логика извлечения кода
            let serializedCode;
            if (currentFullCodeMode) {
                serializedCode = decodedText;
            } else {
                const parts = decodedText.split(GS);
                serializedCode = parts.length > 1 ? parts[1] : decodedText;
            }
            
            if (!serializedCode || serializedCode.trim() === '') {
                showToast("Ошибка кода или неверный формат GS1", true);
                return false;
            }
            
            if (codes.includes(serializedCode)) {
                showToast("Уже отсканирован", true);
                return false;
            }
            
            codes.push(serializedCode);
            updateResults();
            showToast(`✅ +1 (всего: ${codes.length})`);
            updateDebugInfo(`Последний код: ${serializedCode.substring(0, 30)}...`);
            return true;
        }

        // --- Сканирование с камеры с Quagga ---

        window.initCameras = async function() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const cameraSelect = document.getElementById('cameraSelection');
                
                cameraSelect.innerHTML = '<option value="">Выберите камеру...</option>';
                videoDevices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Камера ${cameraSelect.length}`;
                    cameraSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Ошибка получения камер:', error);
            }
        }

        window.toggleScan = function() {
            if (isScanning) {
                stopScan();
            } else {
                startScan();
            }
        }

        window.startScan = function() {
            const cameraId = document.getElementById('cameraSelection').value;
            if (!cameraId) {
                showToast('Сначала выберите камеру', true);
                return;
            }

            const button = document.getElementById('scanButton');
            button.textContent = '⏹️ ОСТАНОВИТЬ СКАНИРОВАНИЕ';
            button.classList.add('scanning');

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.getElementById('interactive'),
                    constraints: {
                        deviceId: cameraId,
                        facingMode: "environment"
                    }
                },
                decoder: {
                    readers: [
                        "code_128_reader",
                        "ean_reader",
                        "ean_8_reader",
                        "code_39_reader",
                        "code_39_vin_reader",
                        "codabar_reader",
                        "upc_reader",
                        "upc_e_reader",
                        "i2of5_reader",
                        "2of5_reader",
                        "code_93_reader"
                    ]
                },
                locate: true
            }, function(err) {
                if (err) {
                    console.error(err);
                    showToast('Ошибка инициализации камеры', true);
                    stopScan();
                    return;
                }
                Quagga.start();
                isScanning = true;
                updateDebugInfo("Камера активна - сканируйте коды");
            });

            Quagga.onDetected(function(result) {
                if (result.codeResult && result.codeResult.code) {
                    processScannedCode(result.codeResult.code);
                }
            });
        }

        window.stopScan = function() {
            if (isScanning) {
                Quagga.stop();
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                isScanning = false;
                
                const button = document.getElementById('scanButton');
                button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                button.classList.remove('scanning');
                updateDebugInfo("Камера остановлена");
            }
        }

        // --- Сканирование из файла ---

        window.scanFromFile = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            event.target.value = null;

            if (file.type === 'application/pdf') {
                showToast('Для PDF используйте скриншоты страниц', true);
                updateDebugInfo('Сделайте скриншот PDF и загрузите как изображение');
            } else if (file.type.startsWith('image/')) {
                scanImageFile(file);
            } else {
                showToast('Неподдерживаемый тип файла', true);
            }
        }

        // Сканирование изображения с использованием jsQR и Quagga
        async function scanImageFile(file) {
            showToast('Сканирование изображения...');
            updateDebugInfo('Обработка изображения...');

            const img = document.getElementById('tempImage');
            const canvas = document.getElementById('tempCanvas');
            const ctx = canvas.getContext('2d');

            return new Promise((resolve) => {
                img.onload = async function() {
                    // Устанавливаем размеры canvas
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // Рисуем изображение на canvas
                    ctx.drawImage(img, 0, 0, img.width, img.height);
                    
                    let foundCode = false;
                    
                    // Попытка 1: Используем jsQR для QR-кодов и DataMatrix
                    try {
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        if (code) {
                            foundCode = processScannedCode(code.data);
                        }
                    } catch (e) {
                        console.log('jsQR не нашел кодов');
                    }
                    
                    // Попытка 2: Используем Quagga для штрихкодов
                    if (!foundCode) {
                        try {
                            const result = await scanWithQuagga(canvas);
                            if (result && result.codeResult && result.codeResult.code) {
                                processScannedCode(result.codeResult.code);
                            } else {
                                showToast('Коды не найдены в изображении', true);
                            }
                        } catch (error) {
                            showToast('Не удалось просканировать изображение', true);
                        }
                    }
                    
                    resolve();
                };
                
                img.src = URL.createObjectURL(file);
            });
        }

        function scanWithQuagga(canvas) {
            return new Promise((resolve) => {
                Quagga.decodeSingle({
                    decoder: {
                        readers: [
                            "code_128_reader",
                            "ean_reader",
                            "code_39_reader",
                            "codabar_reader",
                            "upc_reader"
                        ]
                    },
                    locate: true,
                    src: canvas.toDataURL()
                }, function(result) {
                    resolve(result);
                });
            });
        }

        // --- Утилиты ---

        window.shareCodes = function() {
            if (codes.length === 0) {
                showToast('Нет кодов для отправки', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const file = new File([blob], `codes_${codes.length}.csv`, { type: 'text/csv' });
            
            if (navigator.share) {
                navigator.share({
                    title: `Отсканированные коды (${codes.length})`,
                    files: [file]
                }).catch((error) => {
                    if (error.name !== 'AbortError') {
                        exportCSV();
                    }
                });
            } else {
                exportCSV();
            }
        }

        window.exportCSV = function() {
            if (codes.length === 0) {
                showToast('Нет кодов для скачивания', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codes_${codes.length}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Скачан CSV (${codes.length})`);
        }

        window.clearCodes = function() {
            if (codes.length === 0) return;
            if (confirm(`Очистить ${codes.length} кодов?`)) {
                codes = [];
                updateResults();
                updateDebugInfo('Все коды очищены');
                showToast('Очищено');
            }
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            initCameras();
            updateDebugInfo('Система готова к работе');
        });
    </script>
</body>
</html>
