<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер кодов</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            padding: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #333;
        }
        .settings {
            text-align: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        #reader {
            flex: 1;
            min-height: 35vh;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }
        #results {
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        #scanButton {
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        #scanButton.scanning {
            background: #ffc107;
            color: #000;
        }
        .secondary-btn {
            background: #6c757d;
            color: white;
        }
        .share-btn {
            background: #28a745;
            color: white;
        }
        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Сканер кодов (DataMatrix GS1)</h1>
        </div>
        
        <div class="settings">
            <label>
                <input type="checkbox" id="fullCodeMode" checked="false"> Полный код (все символы GS1)
            </label>
        </div>
        
        <div id="reader">
            <div>Камера не активирована</div>
        </div>
        
        <div id="results">Отсканировано: 0 кодов</div>
        
        <div class="buttons">
            <button id="scanButton" onclick="toggleScan()">▶️ НАЧАТЬ СКАНИРОВАНИЕ</button>
            <button class="share-btn" onclick="shareCodes()">📤 Поделиться</button>
            <button class="secondary-btn" onclick="exportCSV()">💾 Скачать CSV</button>
            <button class="secondary-btn" onclick="clearCodes()">🗑️ Очистить</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let codes = [];
        let html5QrCode = null;
        let isScanning = false;
        let fullCodeMode = false; // По умолчанию выключено
        const GS = String.fromCharCode(29);

        function loadSettings() {
            const saved = localStorage.getItem('fullCodeMode');
            if (saved !== null) {
                fullCodeMode = saved === 'true';
            } else {
                fullCodeMode = false; // По умолчанию false
            }
            document.getElementById('fullCodeMode').checked = fullCodeMode;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#dc3545' : '#28a745';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function updateResults() {
            document.getElementById('results').textContent = 'Отсканировано: ' + codes.length + ' кодов';
        }

        function onScanSuccess(decodedText, result) {
            if (result.result.format.formatName !== 'DATA_MATRIX') {
                showToast('Требуется DataMatrix', true);
                return;
            }

            let serializedCode = fullCodeMode ? decodedText : decodedText.split(GS)[1];
            
            if (!serializedCode) {
                showToast("Ошибка кода", true);
                return;
            }
            
            if (codes.includes(serializedCode)) {
                showToast("Уже отсканирован", true);
                return;
            }
            
            codes.push(serializedCode);
            updateResults();
            showToast(`✅ +1 (всего: ${codes.length})`);
        }

        function toggleScan() {
            if (isScanning) {
                stopScan();
            } else {
                startScan();
            }
        }

        function startScan() {
            const button = document.getElementById('scanButton');
            
            fullCodeMode = document.getElementById('fullCodeMode').checked;
            localStorage.setItem('fullCodeMode', fullCodeMode);

            button.textContent = '⏹️ ОСТАНОВИТЬ СКАНИРОВАНИЕ';
            button.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, 
                { 
                    fps: 10, 
                    qrbox: { width: 200, height: 200 },
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_DATA_MATRIX]
                }, 
                onScanSuccess, 
                () => {}
            ).then(() => {
                isScanning = true;
            }).catch(err => {
                showToast("Ошибка камеры", true);
                stopScan();
            });
        }

        function stopScan() {
            const button = document.getElementById('scanButton');
            
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    button.textContent = '▶️ НАЧАТЬ СКАНИРОВАНИЕ';
                    button.classList.remove('scanning');
                });
            }
        }

        function shareCodes() {
            if (codes.length === 0) {
                showToast('Нет кодов для отправки', true);
                return;
            }
            
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const file = new File([blob], `codes_${codes.length}.csv`, { type: 'text/csv' });
            
            if (navigator.share) {
                navigator.share({
                    title: `Отсканированные коды (${codes.length})`,
                    files: [file]
                }).catch(() => {
                    exportCSV();
                });
            } else {
                exportCSV();
            }
        }

        function exportCSV() {
            const csv = codes.join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `codes_${codes.length}.csv`;
            a.click();
            showToast(`Скачан CSV (${codes.length})`);
        }

        function clearCodes() {
            if (codes.length === 0) return;
            if (confirm(`Очистить ${codes.length} кодов?`)) {
                codes = [];
                updateResults();
                showToast('Очищено');
            }
        }

        // Загружаем настройки при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
        });
    </script>
</body>
</html>
